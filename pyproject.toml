[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-lca-starter"
version = "0.3.0"
description = "Human-in-the-loop AI foreground process interpretation and Brightway candidate matching"
requires-python = ">=3.11,<3.14"
dependencies = [
    "streamlit>=1.45",
    "pandas>=2.2",
    "pydantic>=2.8",
    "openai>=1.57",
    "python-dotenv>=1.0",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "bw2data>=4.0",
]

[project.scripts]
ai-lca-benchmark = "ai_lca.benchmark:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

# Benchmark source/gold packages 003-006 are staged; CI installs this project before event-driven progression.
# Touch this shared CI surface only when a baseline revalidation is intentionally required.
[tool.setuptools.packages.find]
where = ["src"]
