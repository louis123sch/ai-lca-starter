name: Scheduled Phase 1 literature scale batches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/literature-scale-scheduled.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: phase1-autonomous-literature-scale
  cancel-in-progress: false

jobs:
  scale-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: write
    env:
      SPRINGER_API_KEY: ${{ secrets.SPRINGER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5-mini
      OPENAI_SCREEN_MODEL: gpt-5-nano
      OPENAI_REQUEST_TIMEOUT_SECONDS: "180"
    steps:
      - name: Check out Phase 1 branch
        uses: actions/checkout@v4
        with:
          ref: phase1-literature-scale
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore persistent Phase 1 state
        uses: actions/cache@v4
        with:
          path: literature_state
          key: phase1-literature-scale-state-${{ github.run_id }}
          restore-keys: |
            phase1-literature-scale-state-
            phase1-literature-state-
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: Run deterministic tests
        run: python -m pytest -q tests/test_literature.py tests/test_jats.py tests/test_autonomous_literature.py
      - name: Verify API secrets
        shell: bash
        run: |
          test -n "$SPRINGER_API_KEY" || { echo "::error::SPRINGER_API_KEY missing"; exit 2; }
          test -n "$OPENAI_API_KEY" || { echo "::error::OPENAI_API_KEY missing"; exit 2; }
      - name: Process next bounded literature batch
        run: |
          python -m ai_lca.autonomous_literature \
            --mode scale \
            --issn 1614-7502 \
            --from-year 2024 \
            --until-year 2026 \
            --discovery-limit 100 \
            --state-dir literature_state \
            --max-papers 8 \
            --max-paper-workers 3 \
            --max-process-workers 3 \
            --max-concurrent-requests 4 \
            --max-total-calls 100 \
            --max-calls-per-paper 20 \
            --max-total-tokens 3000000 \
            --max-estimated-cost-usd 2.50 \
            --max-repair-calls-per-process 1
      - name: Show latest report
        if: always()
        run: |
          if [ -f literature_state/reports/latest.json ]; then
            cat literature_state/reports/latest.json
          fi
      - name: Upload autonomous state and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-scale-${{ github.run_id }}
          path: literature_state
          retention-days: 30
