name: Controlled benchmark auto-repair (paused)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paused:
    runs-on: ubuntu-latest
    steps:
      - name: Explain paused state
        run: |
          echo "Automatic prompt/code repair from legacy benchmark failures is intentionally paused."
          echo "The v0.4 candidate uses an explicit process-role architecture and should be evaluated with deterministic tests plus frozen blind validation."
          echo "Historical auto-repair behavior remains available in git history and is documented by AUTONOMOUS_ITERATION_PROTOCOL.md."
