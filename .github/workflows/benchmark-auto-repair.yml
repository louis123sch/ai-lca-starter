name: Controlled benchmark auto-repair

on:
  workflow_run:
    workflows: ["Gerloff unseen validation benchmark"]
    types: [completed]
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: "Gerloff workflow run ID to diagnose"
        required: true
      failed_head_sha:
        description: "Commit SHA evaluated by the failed Gerloff run"
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: ai-lca-auto-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 12

      - name: Skip stale benchmark failures
        id: freshness
        env:
          FAILED_HEAD: ${{ github.event.workflow_run.head_sha || inputs.failed_head_sha }}
        shell: bash
        run: |
          git fetch origin main
          CURRENT="$(git rev-parse origin/main)"
          if [ "$CURRENT" != "$FAILED_HEAD" ]; then
            echo "Current main ($CURRENT) is newer than failed benchmark head ($FAILED_HEAD); skipping stale repair."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce three-repair safety cap
        if: steps.freshness.outputs.run == 'true'
        id: cap
        shell: bash
        run: |
          COUNT=0
          while IFS= read -r MSG; do
            if [[ "$MSG" == auto-repair:* ]]; then
              COUNT=$((COUNT + 1))
            else
              break
            fi
          done < <(git log -8 --pretty=%s)
          echo "Consecutive auto-repair commits: $COUNT"
          if [ "$COUNT" -ge 3 ]; then
            echo "Three consecutive automatic repairs reached; stopping for human review."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download failed benchmark artifact
        if: steps.freshness.outputs.run == 'true' && steps.cap.outputs.run == 'true'
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.failed_run_id }}
        shell: bash
        run: |
          mkdir -p repair_input
          if gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "gerloff-benchmark-$RUN_ID" --dir repair_input; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "No benchmark artifact was available; this may be an infrastructure/test failure rather than extraction quality."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.artifact.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        if: steps.artifact.outputs.available == 'true'
        run: python -m pip install -e ".[test]"

      - name: Ask repair agent for one conservative change
        if: steps.artifact.outputs.available == 'true'
        id: repair
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REPAIR_MODEL: gpt-5-mini
        shell: bash
        run: |
          ROOT="repair_input"
          if [ -d "repair_input/benchmark_runs/gerloff_2021" ]; then
            ROOT="repair_input/benchmark_runs/gerloff_2021"
          elif [ -d "repair_input/gerloff_2021" ]; then
            ROOT="repair_input/gerloff_2021"
          fi
          python -m ai_lca.repair_agent \
            --benchmark-root "$ROOT" \
            --source \
              benchmarks/gerloff_2021/source_main_excerpt.txt \
              benchmarks/gerloff_2021/source_supplement_machine_readable.txt \
            --result repair_result.json
          CHANGED="$(python -c 'import json; print(str(json.load(open("repair_result.json"))["changed"]).lower())')"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Run deterministic tests without secrets
        if: steps.repair.outputs.changed == 'true'
        env:
          OPENAI_API_KEY: ""
          GH_TOKEN: ""
        run: python -m pytest -q

      - name: Commit validated repair
        if: steps.repair.outputs.changed == 'true'
        id: commit
        shell: bash
        run: |
          git config user.name "ai-lca-benchmark-bot"
          git config user.email "ai-lca-benchmark-bot@users.noreply.github.com"
          git add src/ai_lca/llm.py
          git commit -m "auto-repair: improve unseen-paper extraction"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger validation benchmarks immediately
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # GITHUB_TOKEN pushes do not trigger push workflows, so explicitly dispatch both validations.
          gh workflow run gerloff-benchmark.yml --repo "$GITHUB_REPOSITORY" --ref main -f runs=3
          gh workflow run hermesmann-benchmark.yml --repo "$GITHUB_REPOSITORY" --ref main -f runs=3

      - name: Wait for validations and continue safely
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"

          latest_for_head() {
            local workflow="$1"
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main --limit 30 \
              --json databaseId,headSha,status,conclusion,createdAt \
              | jq -c --arg SHA "$HEAD_SHA" '[.[] | select(.headSha == $SHA)] | sort_by(.createdAt) | last // {}'
          }

          GERLOFF='{}'
          HERMESMANN='{}'
          for _ in $(seq 1 180); do
            GERLOFF="$(latest_for_head gerloff-benchmark.yml)"
            HERMESMANN="$(latest_for_head hermesmann-benchmark.yml)"
            GS="$(jq -r '.status // ""' <<<"$GERLOFF")"
            HS="$(jq -r '.status // ""' <<<"$HERMESMANN")"
            if [ "$GS" = "completed" ] && [ "$HS" = "completed" ]; then
              break
            fi
            sleep 15
          done

          GID="$(jq -r '.databaseId // empty' <<<"$GERLOFF")"
          HID="$(jq -r '.databaseId // empty' <<<"$HERMESMANN")"
          GC="$(jq -r '.conclusion // empty' <<<"$GERLOFF")"
          HC="$(jq -r '.conclusion // empty' <<<"$HERMESMANN")"
          echo "Gerloff run $GID: $GC"
          echo "Hermesmann run $HID: $HC"

          if [ "$GC" = "success" ] && [ "$HC" = "success" ]; then
            if ! gh run list --repo "$GITHUB_REPOSITORY" --workflow benchmark-003.yml --branch main --limit 30 \
              --json headSha | jq -e --arg SHA "$HEAD_SHA" 'any(.[]; .headSha == $SHA)' >/dev/null; then
              echo "Baseline pair passed; dispatching Benchmark 003."
              gh workflow run benchmark-003.yml --repo "$GITHUB_REPOSITORY" --ref main -f runs=3
            fi
          elif [ "$GC" = "failure" ] && [ "$HC" = "success" ] && [ -n "$GID" ]; then
            echo "Gerloff still fails while Hermesmann is stable; dispatching the next bounded repair iteration."
            gh workflow run benchmark-auto-repair.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f failed_run_id="$GID" -f failed_head_sha="$HEAD_SHA"
          else
            echo "Validation pair did not reach a safe auto-continue state; stopping for supervisory review."
          fi

      - name: Record no-change diagnosis
        if: steps.artifact.outputs.available == 'true' && steps.repair.outputs.changed != 'true'
        run: cat repair_result.json
