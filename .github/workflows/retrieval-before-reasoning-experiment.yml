name: Retrieval-before-reasoning single iteration

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: retrieval-before-reasoning-single-pr15
  cancel-in-progress: true

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_MODEL: gpt-5-mini
  OPENAI_SCREEN_MODEL: gpt-5-nano
  OPENAI_REPAIR_MODEL: gpt-5-mini
  BASELINE_RUN_ID: "31473783816"
  BASELINE_ARTIFACT: "phase1-scale-31473783816"

jobs:
  iterate_once:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out PR 15 development branch
        uses: actions/checkout@v4
        with:
          ref: agent/retrieval-before-reasoning-clean
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Verify experiment secret
        run: test -n "$OPENAI_API_KEY" || { echo "::error::OPENAI_API_KEY missing"; exit 2; }

      - name: Download exact frozen corpus
        uses: actions/download-artifact@v4
        with:
          name: phase1-scale-31473783816
          path: frozen_corpus
          repository: louis123sch/ai-lca-starter
          run-id: 31473783816
          github-token: ${{ github.token }}

      - name: Materialize immutable replay manifest
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          from pathlib import Path
          from ai_lca.corpus_diagnostics import BASELINE_MANIFEST, load_baseline_papers

          baseline_id, papers = load_baseline_papers(Path('frozen_corpus'), BASELINE_MANIFEST)
          manifest = json.loads(BASELINE_MANIFEST.read_text(encoding='utf-8'))
          manifest['baseline_id'] = baseline_id
          manifest['papers'] = papers
          Path('artifacts/frozen_replay_manifest.json').write_text(
              json.dumps(manifest, indent=2) + '\n', encoding='utf-8'
          )
          assert len(papers) == 44, len(papers)
          PY

      - name: Deterministic preflight
        run: |
          python -m compileall -q app.py src tests
          python -m pytest -q
          python - <<'PY'
          from ai_lca.autonomous_code_iteration import _changed_paths, _normalise_unified_diff
          sample = '''--- a/src/ai_lca/evidence_router.py
          +++ b/src/ai_lca/evidence_router.py
          @@ -1,1 +1,1 @@
          -old
          +new
          '''
          normalised = _normalise_unified_diff(sample)
          assert _changed_paths(normalised) == {'src/ai_lca/evidence_router.py'}
          PY

      - name: Audit router against all 44 frozen papers before API calls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from ai_lca.inventory_replay import select_dois
          from ai_lca.retrieval_replay import audit_router

          state = Path('frozen_corpus')
          manifest = Path('artifacts/frozen_replay_manifest.json')
          dois = select_dois(state_dir=state, manifest=manifest, subset='full')
          audit = audit_router(state, manifest, dois)
          Path('artifacts/router_audit_full.json').write_text(json.dumps(audit, indent=2) + '\n', encoding='utf-8')
          assert audit['paper_count'] == 44, audit['paper_count']
          assert audit['inventory_safety_pass'], audit
          assert audit['unsafe_exclusion_count'] == 0, audit
          PY

      - name: Prepare canary states
        run: |
          cp -a frozen_corpus current_control_canary_state
          cp -a frozen_corpus current_routed_canary_state

      - name: Run frozen control canary
        id: current_control_canary
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m ai_lca.frozen_replay \
            --mode control \
            --state-dir current_control_canary_state \
            --manifest artifacts/frozen_replay_manifest.json \
            --subset canary \
            --max-total-calls 60 \
            --max-calls-per-paper 20 \
            --max-total-tokens 400000 \
            --max-estimated-cost-usd 0.25 \
            --output artifacts/current_control_canary.json 2>&1 | tee artifacts/current_control_canary.log

      - name: Run current retrieval canary
        id: current_routed_canary
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m ai_lca.frozen_replay \
            --mode routed \
            --state-dir current_routed_canary_state \
            --manifest artifacts/frozen_replay_manifest.json \
            --subset canary \
            --max-total-calls 60 \
            --max-calls-per-paper 20 \
            --max-total-tokens 400000 \
            --max-estimated-cost-usd 0.25 \
            --output artifacts/current_routed_canary.json 2>&1 | tee artifacts/current_routed_canary.log

      - name: Compare current retrieval to control
        id: current_canary_gate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m ai_lca.retrieval_compare \
            --control artifacts/current_control_canary.json \
            --routed artifacts/current_routed_canary.json \
            --control-state current_control_canary_state \
            --routed-state current_routed_canary_state \
            --manifest artifacts/frozen_replay_manifest.json \
            --output artifacts/current_canary_comparison.json 2>&1 | tee artifacts/current_canary_comparison.log

      - name: Classify single-iteration state
        id: state
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p = Path('artifacts/current_canary_comparison.json')
          report = json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          incomplete = report.get('failure_mode') == 'benchmark_incomplete' or not report.get('benchmark_complete', False)
          passed = bool(report.get('pass_gate'))
          print('benchmark_valid=' + ('false' if incomplete else 'true'))
          print('repair_needed=' + ('true' if (not incomplete and not passed) else 'false'))
          print('already_passed=' + ('true' if passed else 'false'))
          PY

      - name: Build bounded repair diagnostics
        if: steps.state.outputs.repair_needed == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(name):
              p = Path(name)
              if not p.exists():
                  return None
              try:
                  return json.loads(p.read_text(encoding='utf-8'))
              except json.JSONDecodeError:
                  return None

          report = {
              'failure_class_ranking': [{
                  'failure_class': 'RETRIEVAL_BEFORE_REASONING',
                  'affected_papers': 8,
                  'priority_score': 1.0,
              }],
              'router_audit': load('artifacts/router_audit_full.json'),
              'current_control_canary': load('artifacts/current_control_canary.json'),
              'current_routed_canary': load('artifacts/current_routed_canary.json'),
              'current_canary_comparison': load('artifacts/current_canary_comparison.json'),
              'current_full_comparison': None,
          }
          Path('artifacts/retrieval_diagnostics.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Propose exactly one diagnostic-driven repair
        if: steps.state.outputs.repair_needed == 'true'
        id: proposal
        continue-on-error: true
        run: |
          python -m ai_lca.retrieval_autonomous_iteration \
            --diagnostics artifacts/retrieval_diagnostics.json \
            --model "$OPENAI_REPAIR_MODEL" \
            --reasoning-effort medium \
            --max-context-chars 120000 \
            --max-proposal-attempts 1 \
            --history-file .autonomy/retrieval_rejection_history.jsonl \
            --max-history-entries 12 \
            --output-dir artifacts/retrieval_autonomous_iteration

      - name: Validate proposed change scope
        if: steps.state.outputs.repair_needed == 'true'
        id: repair_change
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "has_change=false" >> "$GITHUB_OUTPUT"
            echo "scope_valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(src/ai_lca/(evidence_router|retrieval_processor|retrieval_replay)\.py|tests/test_(evidence_router|retrieval_compare|frozen_replay)\.py)$' || true)"
          if [ -n "$bad" ]; then
            echo "::warning::Proposal touched protected evaluation/infrastructure files: $bad"
            echo "has_change=false" >> "$GITHUB_OUTPUT"
            echo "scope_valid=false" >> "$GITHUB_OUTPUT"
            git restore -- .
          else
            echo "has_change=true" >> "$GITHUB_OUTPUT"
            echo "scope_valid=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare patched routed canary
        if: steps.repair_change.outputs.has_change == 'true'
        run: cp -a frozen_corpus patched_routed_canary_state

      - name: Run patched retrieval canary
        if: steps.repair_change.outputs.has_change == 'true'
        id: patched_routed_canary
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m ai_lca.frozen_replay \
            --mode routed \
            --state-dir patched_routed_canary_state \
            --manifest artifacts/frozen_replay_manifest.json \
            --subset canary \
            --max-total-calls 60 \
            --max-calls-per-paper 20 \
            --max-total-tokens 400000 \
            --max-estimated-cost-usd 0.25 \
            --output artifacts/patched_routed_canary.json 2>&1 | tee artifacts/patched_routed_canary.log

      - name: Compare patched retrieval against the same control
        if: steps.repair_change.outputs.has_change == 'true'
        id: patched_canary_gate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m ai_lca.retrieval_compare \
            --control artifacts/current_control_canary.json \
            --routed artifacts/patched_routed_canary.json \
            --control-state current_control_canary_state \
            --routed-state patched_routed_canary_state \
            --manifest artifacts/frozen_replay_manifest.json \
            --output artifacts/patched_canary_comparison.json 2>&1 | tee artifacts/patched_canary_comparison.log

      - name: Summarize single-iteration progress
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(name):
              p = Path(name)
              if not p.exists():
                  return {}
              try:
                  return json.loads(p.read_text(encoding='utf-8'))
              except json.JSONDecodeError:
                  return {}

          before = load('artifacts/current_canary_comparison.json')
          after = load('artifacts/patched_canary_comparison.json')
          iteration = load('artifacts/retrieval_autonomous_iteration/iteration.json')
          current_routed = load('artifacts/current_routed_canary.json')
          patched_routed = load('artifacts/patched_routed_canary.json')

          def stats(report):
              regressions = report.get('regressions') or []
              return {
                  'regression_papers': len(regressions),
                  'lost_unprotected_flows': sum(len(r.get('lost_unprotected_flow_candidate_ids') or []) for r in regressions),
                  'regression_reasons': sum(len(r.get('reasons') or []) for r in regressions),
              }

          before_stats = stats(before)
          after_stats = stats(after)
          before_dois = {r.get('doi') for r in before.get('regressions') or [] if r.get('doi')}
          after_dois = {r.get('doi') for r in after.get('regressions') or [] if r.get('doi')}
          accepted = bool(after.get('pass_gate'))
          router_safe = bool(after.get('router_safety_pass'))
          scientific_progress = accepted or (
              bool(after)
              and router_safe
              and after_stats['regression_papers'] <= before_stats['regression_papers']
              and after_stats['lost_unprotected_flows'] < before_stats['lost_unprotected_flows']
              and not (after_dois - before_dois)
          )
          verdict = (
              'ACCEPTED' if accepted else
              'PROGRESS_NOT_ACCEPTED' if scientific_progress else
              'NO_PROGRESS' if after else
              'NO_TESTABLE_PATCH'
          )
          result = {
              'verdict': verdict,
              'accepted_by_canary_gate': accepted,
              'scientific_progress': scientific_progress,
              'before': before_stats,
              'after': after_stats,
              'new_regression_dois': sorted(after_dois - before_dois),
              'resolved_regression_dois': sorted(before_dois - after_dois),
              'router_safety_pass': router_safe,
              'proposal_summary': iteration.get('summary'),
              'proposal_changed_paths': iteration.get('changed_paths') or [],
              'deterministic_tests_passed': iteration.get('deterministic_tests_passed'),
              'current_routed_usage': current_routed.get('usage') or {},
              'patched_routed_usage': patched_routed.get('usage') or {},
              'workflow_is_single_shot': True,
              'branch_mutation_allowed': False,
              'automatic_dispatch_allowed': False,
          }
          Path('artifacts/single_iteration_progress.json').write_text(
              json.dumps(result, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Upload single-iteration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-single-${{ github.run_id }}
          path: artifacts
          retention-days: 30
