name: Retrieval-before-reasoning autonomous improvement

on:
  push:
    branches: [agent/retrieval-before-reasoning-clean]
    paths:
      - "src/ai_lca/evidence_router.py"
      - "src/ai_lca/retrieval_processor.py"
      - "src/ai_lca/retrieval_replay.py"
      - "src/ai_lca/retrieval_compare.py"
      - "src/ai_lca/frozen_replay.py"
      - "src/ai_lca/retrieval_autonomous_iteration.py"
      - "tests/test_evidence_router.py"
      - "tests/test_retrieval_compare.py"
      - "tests/test_frozen_replay.py"
      - ".autonomy/retrieval_rejection_history.jsonl"
      - ".github/workflows/retrieval-before-reasoning-experiment.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: retrieval-before-reasoning-autonomous-pr15
  cancel-in-progress: true

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  SPRINGER_API_KEY: ${{ secrets.SPRINGER_API_KEY }}
  OPENAI_MODEL: gpt-5-mini
  OPENAI_SCREEN_MODEL: gpt-5-nano
  OPENAI_REPAIR_MODEL: gpt-5-mini
  BASELINE_RUN_ID: "31473783816"
  BASELINE_ARTIFACT: "phase1-scale-31473783816"
  DEVELOPMENT_BRANCH: "agent/retrieval-before-reasoning-clean"

jobs:
  iterate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out PR 15 development branch
        uses: actions/checkout@v4
        with:
          ref: agent/retrieval-before-reasoning-clean
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Verify experiment secrets
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "::error::OPENAI_API_KEY missing"; exit 2; }

      - name: Download exact frozen corpus
        uses: actions/download-artifact@v4
        with:
          name: phase1-scale-31473783816
          path: frozen_corpus
          repository: louis123sch/ai-lca-starter
          run-id: 31473783816
          github-token: ${{ github.token }}

      - name: Materialize immutable replay manifest
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          from pathlib import Path
          from ai_lca.corpus_diagnostics import BASELINE_MANIFEST, load_baseline_papers

          baseline_id, papers = load_baseline_papers(Path('frozen_corpus'), BASELINE_MANIFEST)
          manifest = json.loads(BASELINE_MANIFEST.read_text(encoding='utf-8'))
          manifest['baseline_id'] = baseline_id
          manifest['papers'] = papers
          Path('artifacts/frozen_replay_manifest.json').write_text(
              json.dumps(manifest, indent=2) + '\n', encoding='utf-8'
          )
          assert len(papers) == 44, len(papers)
          PY

      - name: Run deterministic tests
        run: |
          python -m compileall -q app.py src tests
          python -m pytest -q

      - name: Audit router against all 44 frozen papers before API calls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from ai_lca.inventory_replay import select_dois
          from ai_lca.retrieval_replay import audit_router

          state = Path('frozen_corpus')
          manifest = Path('artifacts/frozen_replay_manifest.json')
          dois = select_dois(state_dir=state, manifest=manifest, subset='full')
          audit = audit_router(state, manifest, dois)
          Path('artifacts/router_audit_full.json').write_text(json.dumps(audit, indent=2) + '\n', encoding='utf-8')
          summary = {k: v for k, v in audit.items() if k != 'per_paper'}
          print(json.dumps(summary, indent=2))
          assert audit['paper_count'] == 44, audit['paper_count']
          assert audit['inventory_safety_pass'], audit
          assert audit['unsafe_exclusion_count'] == 0, audit
          PY

      - name: Prepare current-head canary states
        run: |
          cp -a frozen_corpus current_control_canary_state
          cp -a frozen_corpus current_routed_canary_state

      - name: Run current frozen control canary
        id: current_control_canary
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m ai_lca.frozen_replay \
            --mode control \
            --state-dir current_control_canary_state \
            --manifest artifacts/frozen_replay_manifest.json \
            --subset canary \
            --max-total-calls 100 \
            --max-calls-per-paper 20 \
            --max-total-tokens 1500000 \
            --max-estimated-cost-usd 1.00 \
            --output artifacts/current_control_canary.json 2>&1 | tee artifacts/current_control_canary.log

      - name: Run current frozen retrieval canary
        id: current_routed_canary
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m ai_lca.frozen_replay \
            --mode routed \
            --state-dir current_routed_canary_state \
            --manifest artifacts/frozen_replay_manifest.json \
            --subset canary \
            --max-total-calls 100 \
            --max-calls-per-paper 20 \
            --max-total-tokens 1500000 \
            --max-estimated-cost-usd 1.00 \
            --output artifacts/current_routed_canary.json 2>&1 | tee artifacts/current_routed_canary.log

      - name: Gate current retrieval against canary control
        id: current_canary_gate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m ai_lca.retrieval_compare \
            --control artifacts/current_control_canary.json \
            --routed artifacts/current_routed_canary.json \
            --control-state current_control_canary_state \
            --routed-state current_routed_canary_state \
            --manifest artifacts/frozen_replay_manifest.json \
            --output artifacts/current_canary_comparison.json 2>&1 | tee artifacts/current_canary_comparison.log

      - name: Prepare current-head full states
        if: steps.current_canary_gate.outcome == 'success'
        run: |
          cp -a frozen_corpus current_control_full_state
          cp -a frozen_corpus current_routed_full_state

      - name: Run current frozen control on all 44
        if: steps.current_canary_gate.outcome == 'success'
        id: current_control_full
        continue-on-error: true
        run: |
          python -m ai_lca.frozen_replay \
            --mode control \
            --state-dir current_control_full_state \
            --manifest artifacts/frozen_replay_manifest.json \
            --subset full \
            --max-total-calls 320 \
            --max-calls-per-paper 20 \
            --max-total-tokens 5000000 \
            --max-estimated-cost-usd 4.00 \
            --output artifacts/current_control_full.json

      - name: Run current frozen retrieval on all 44
        if: steps.current_canary_gate.outcome == 'success'
        id: current_routed_full
        continue-on-error: true
        run: |
          python -m ai_lca.frozen_replay \
            --mode routed \
            --state-dir current_routed_full_state \
            --manifest artifacts/frozen_replay_manifest.json \
            --subset full \
            --max-total-calls 320 \
            --max-calls-per-paper 20 \
            --max-total-tokens 5000000 \
            --max-estimated-cost-usd 4.00 \
            --output artifacts/current_routed_full.json

      - name: Gate current retrieval against full control
        if: steps.current_canary_gate.outcome == 'success'
        id: current_full_gate
        continue-on-error: true
        run: |
          python -m ai_lca.retrieval_compare \
            --control artifacts/current_control_full.json \
            --routed artifacts/current_routed_full.json \
            --control-state current_control_full_state \
            --routed-state current_routed_full_state \
            --manifest artifacts/frozen_replay_manifest.json \
            --output artifacts/current_full_comparison.json

      - name: Classify current A/B state
        id: state
        env:
          CANARY_OUTCOME: ${{ steps.current_canary_gate.outcome }}
          FULL_OUTCOME: ${{ steps.current_full_gate.outcome }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          def load(path):
              p = Path(path)
              if not p.exists():
                  return {}
              try:
                  return json.loads(p.read_text(encoding='utf-8'))
              except json.JSONDecodeError:
                  return {}

          canary = load('artifacts/current_canary_comparison.json')
          full = load('artifacts/current_full_comparison.json')
          if canary.get('failure_mode') == 'benchmark_incomplete':
              print('benchmark_valid=false')
              print('repair_needed=false')
              print('passed=false')
          elif os.environ.get('CANARY_OUTCOME') == 'success' and os.environ.get('FULL_OUTCOME') == 'success':
              print('benchmark_valid=true')
              print('repair_needed=false')
              print('passed=true')
          elif full.get('failure_mode') == 'benchmark_incomplete':
              print('benchmark_valid=false')
              print('repair_needed=false')
              print('passed=false')
          else:
              print('benchmark_valid=true')
              print('repair_needed=true')
              print('passed=false')
          PY

      - name: Enforce autonomous search caps
        if: steps.state.outputs.repair_needed == 'true'
        id: caps
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          path = Path('.autonomy/retrieval_rejection_history.jsonl')
          scientific = 0
          proposal = 0
          if path.exists():
              for raw in path.read_text(encoding='utf-8').splitlines():
                  try:
                      row = json.loads(raw)
                  except json.JSONDecodeError:
                      continue
                  if row.get('failure_class') == 'RETRIEVAL_BEFORE_REASONING' and row.get('rejected_at_gate') in {'canary', 'full'}:
                      scientific += 1
                  elif row.get('failure_class') == 'RETRIEVAL_PROPOSAL_FAILURE':
                      proposal += 1
          print(f'scientific_count={scientific}')
          print(f'proposal_count={proposal}')
          print('allow_scientific=' + ('true' if scientific < 20 else 'false'))
          print('allow_proposal=' + ('true' if proposal < 5 else 'false'))
          PY

      - name: Build aggregate retrieval diagnostics
        if: steps.state.outputs.repair_needed == 'true' && steps.caps.outputs.allow_scientific == 'true' && steps.caps.outputs.allow_proposal == 'true'
        env:
          CONTROL_OUTCOME: ${{ steps.current_control_canary.outcome }}
          ROUTED_OUTCOME: ${{ steps.current_routed_canary.outcome }}
          CANARY_GATE_OUTCOME: ${{ steps.current_canary_gate.outcome }}
          FULL_GATE_OUTCOME: ${{ steps.current_full_gate.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def load(name):
              path = Path(name)
              if not path.exists():
                  return None
              try:
                  return json.loads(path.read_text(encoding='utf-8'))
              except json.JSONDecodeError:
                  return None

          def tail(name, n=5000):
              path = Path(name)
              if not path.exists():
                  return None
              return path.read_text(encoding='utf-8', errors='replace')[-n:]

          report = {
              'failure_class_ranking': [{
                  'failure_class': 'RETRIEVAL_BEFORE_REASONING',
                  'affected_papers': 44,
                  'priority_score': 1.0,
              }],
              'router_audit': load('artifacts/router_audit_full.json'),
              'current_control_canary': load('artifacts/current_control_canary.json'),
              'current_routed_canary': load('artifacts/current_routed_canary.json'),
              'current_canary_comparison': load('artifacts/current_canary_comparison.json'),
              'current_full_comparison': load('artifacts/current_full_comparison.json'),
              'step_outcomes': {
                  'control_canary': os.environ.get('CONTROL_OUTCOME'),
                  'routed_canary': os.environ.get('ROUTED_OUTCOME'),
                  'canary_gate': os.environ.get('CANARY_GATE_OUTCOME'),
                  'full_gate': os.environ.get('FULL_GATE_OUTCOME'),
              },
              'log_tails': {
                  'control_canary': tail('artifacts/current_control_canary.log'),
                  'routed_canary': tail('artifacts/current_routed_canary.log'),
                  'canary_compare': tail('artifacts/current_canary_comparison.log'),
              },
          }
          Path('artifacts/retrieval_diagnostics.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Propose one diagnostic-driven retrieval repair
        if: steps.state.outputs.repair_needed == 'true' && steps.caps.outputs.allow_scientific == 'true' && steps.caps.outputs.allow_proposal == 'true'
        id: proposal
        continue-on-error: true
        run: |
          python -m ai_lca.retrieval_autonomous_iteration \
            --diagnostics artifacts/retrieval_diagnostics.json \
            --model "$OPENAI_REPAIR_MODEL" \
            --reasoning-effort medium \
            --max-context-chars 120000 \
            --max-proposal-attempts 3 \
            --history-file .autonomy/retrieval_rejection_history.jsonl \
            --max-history-entries 12 \
            --output-dir artifacts/retrieval_autonomous_iteration

      - name: Detect proposed retrieval code change
        if: steps.state.outputs.repair_needed == 'true' && steps.caps.outputs.allow_scientific == 'true' && steps.caps.outputs.allow_proposal == 'true'
        id: repair_change
        shell: bash
        run: |
          if git diff --quiet -- \
            src/ai_lca/evidence_router.py \
            src/ai_lca/retrieval_processor.py \
            src/ai_lca/retrieval_replay.py \
            src/ai_lca/retrieval_compare.py \
            src/ai_lca/frozen_replay.py \
            tests/test_evidence_router.py \
            tests/test_retrieval_compare.py \
            tests/test_frozen_replay.py; then
            echo "has_change=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_change=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare patched canary states
        if: steps.repair_change.outputs.has_change == 'true'
        run: |
          cp -a frozen_corpus patched_control_canary_state
          cp -a frozen_corpus patched_routed_canary_state

      - name: Run patched frozen control canary
        if: steps.repair_change.outputs.has_change == 'true'
        id: patched_control_canary
        continue-on-error: true
        run: |
          python -m ai_lca.frozen_replay \
            --mode control \
            --state-dir patched_control_canary_state \
            --manifest artifacts/frozen_replay_manifest.json \
            --subset canary \
            --max-total-calls 100 \
            --max-calls-per-paper 20 \
            --max-total-tokens 1500000 \
            --max-estimated-cost-usd 1.00 \
            --output artifacts/patched_control_canary.json

      - name: Run patched frozen retrieval canary
        if: steps.repair_change.outputs.has_change == 'true'
        id: patched_routed_canary
        continue-on-error: true
        run: |
          python -m ai_lca.frozen_replay \
            --mode routed \
            --state-dir patched_routed_canary_state \
            --manifest artifacts/frozen_replay_manifest.json \
            --subset canary \
            --max-total-calls 100 \
            --max-calls-per-paper 20 \
            --max-total-tokens 1500000 \
            --max-estimated-cost-usd 1.00 \
            --output artifacts/patched_routed_canary.json

      - name: Gate patched retrieval against canary control
        if: steps.repair_change.outputs.has_change == 'true'
        id: patched_canary_gate
        continue-on-error: true
        run: |
          python -m ai_lca.retrieval_compare \
            --control artifacts/patched_control_canary.json \
            --routed artifacts/patched_routed_canary.json \
            --control-state patched_control_canary_state \
            --routed-state patched_routed_canary_state \
            --manifest artifacts/frozen_replay_manifest.json \
            --output artifacts/patched_canary_comparison.json

      - name: Prepare patched full states
        if: steps.repair_change.outputs.has_change == 'true' && steps.patched_canary_gate.outcome == 'success'
        run: |
          cp -a frozen_corpus patched_control_full_state
          cp -a frozen_corpus patched_routed_full_state

      - name: Run patched frozen control on all 44
        if: steps.repair_change.outputs.has_change == 'true' && steps.patched_canary_gate.outcome == 'success'
        id: patched_control_full
        continue-on-error: true
        run: |
          python -m ai_lca.frozen_replay \
            --mode control \
            --state-dir patched_control_full_state \
            --manifest artifacts/frozen_replay_manifest.json \
            --subset full \
            --max-total-calls 320 \
            --max-calls-per-paper 20 \
            --max-total-tokens 5000000 \
            --max-estimated-cost-usd 4.00 \
            --output artifacts/patched_control_full.json

      - name: Run patched frozen retrieval on all 44
        if: steps.repair_change.outputs.has_change == 'true' && steps.patched_canary_gate.outcome == 'success'
        id: patched_routed_full
        continue-on-error: true
        run: |
          python -m ai_lca.frozen_replay \
            --mode routed \
            --state-dir patched_routed_full_state \
            --manifest artifacts/frozen_replay_manifest.json \
            --subset full \
            --max-total-calls 320 \
            --max-calls-per-paper 20 \
            --max-total-tokens 5000000 \
            --max-estimated-cost-usd 4.00 \
            --output artifacts/patched_routed_full.json

      - name: Gate patched retrieval against full control
        if: steps.repair_change.outputs.has_change == 'true' && steps.patched_canary_gate.outcome == 'success'
        id: patched_full_gate
        continue-on-error: true
        run: |
          python -m ai_lca.retrieval_compare \
            --control artifacts/patched_control_full.json \
            --routed artifacts/patched_routed_full.json \
            --control-state patched_control_full_state \
            --routed-state patched_routed_full_state \
            --manifest artifacts/frozen_replay_manifest.json \
            --output artifacts/patched_full_comparison.json

      - name: Commit accepted retrieval repair
        if: steps.repair_change.outputs.has_change == 'true' && steps.patched_full_gate.outcome == 'success'
        shell: bash
        run: |
          git config user.name "ai-lca-retrieval-autonomous-development"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/ai_lca/evidence_router.py \
            src/ai_lca/retrieval_processor.py \
            src/ai_lca/retrieval_replay.py \
            src/ai_lca/retrieval_compare.py \
            src/ai_lca/frozen_replay.py \
            tests/test_evidence_router.py \
            tests/test_retrieval_compare.py \
            tests/test_frozen_replay.py
          git diff --cached --quiet && { echo "::error::No allowed retrieval change staged."; exit 5; }
          git commit -m "Improve retrieval-before-reasoning autonomously"
          git push origin HEAD:agent/retrieval-before-reasoning-clean

      - name: Record rejected retrieval experiment
        if: steps.state.outputs.repair_needed == 'true' && steps.caps.outputs.allow_scientific == 'true' && steps.caps.outputs.allow_proposal == 'true' && !(steps.repair_change.outputs.has_change == 'true' && steps.patched_full_gate.outcome == 'success')
        env:
          PROPOSAL_OUTCOME: ${{ steps.proposal.outcome }}
          HAS_CHANGE: ${{ steps.repair_change.outputs.has_change }}
          PATCHED_CANARY_OUTCOME: ${{ steps.patched_canary_gate.outcome }}
          PATCHED_FULL_OUTCOME: ${{ steps.patched_full_gate.outcome }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def load(path):
              p = Path(path)
              if not p.exists():
                  return {}
              try:
                  return json.loads(p.read_text(encoding='utf-8'))
              except json.JSONDecodeError:
                  return {}

          iteration = load('artifacts/retrieval_autonomous_iteration/iteration.json')
          has_change = os.environ.get('HAS_CHANGE') == 'true'
          canary_failed = os.environ.get('PATCHED_CANARY_OUTCOME') == 'failure'
          full_failed = os.environ.get('PATCHED_FULL_OUTCOME') == 'failure'
          if has_change and full_failed:
              rejected_at = 'full'
              failure_class = 'RETRIEVAL_BEFORE_REASONING'
              comparison = load('artifacts/patched_full_comparison.json')
          elif has_change and canary_failed:
              rejected_at = 'canary'
              failure_class = 'RETRIEVAL_BEFORE_REASONING'
              comparison = load('artifacts/patched_canary_comparison.json')
          else:
              rejected_at = 'proposal'
              failure_class = iteration.get('failure_class') or 'RETRIEVAL_PROPOSAL_FAILURE'
              comparison = load('artifacts/current_canary_comparison.json')

          reasons = []
          for regression in comparison.get('regressions', []) or []:
              reasons.extend(regression.get('reasons') or ([regression.get('reason')] if regression.get('reason') else []))
          if not reasons:
              reasons = [
                  f"proposal={os.environ.get('PROPOSAL_OUTCOME')}",
                  f"patched_canary={os.environ.get('PATCHED_CANARY_OUTCOME')}",
                  f"patched_full={os.environ.get('PATCHED_FULL_OUTCOME')}",
              ]

          record = {
              'run_id': os.environ.get('RUN_ID'),
              'failure_class': failure_class,
              'summary': iteration.get('summary') or 'No accepted bounded retrieval repair',
              'rationale': iteration.get('rationale') or 'The proposal or corpus gates did not yield an acceptable retrieval improvement.',
              'hypothesis': iteration.get('hypothesis'),
              'rejected_at_gate': rejected_at,
              'regression_reasons': sorted(set(str(x) for x in reasons if x)),
          }
          history = Path('.autonomy/retrieval_rejection_history.jsonl')
          history.parent.mkdir(parents=True, exist_ok=True)
          with history.open('a', encoding='utf-8') as handle:
              handle.write(json.dumps(record, sort_keys=True) + '\n')
          PY
          git restore -- \
            src/ai_lca/evidence_router.py \
            src/ai_lca/retrieval_processor.py \
            src/ai_lca/retrieval_replay.py \
            src/ai_lca/retrieval_compare.py \
            src/ai_lca/frozen_replay.py \
            tests/test_evidence_router.py \
            tests/test_retrieval_compare.py \
            tests/test_frozen_replay.py
          git config user.name "ai-lca-retrieval-autonomous-development"
          git config user.email "actions@users.noreply.github.com"
          git add .autonomy/retrieval_rejection_history.jsonl
          git diff --cached --quiet || git commit -m "Record rejected retrieval experiment"
          git push origin HEAD:agent/retrieval-before-reasoning-clean

      - name: Explicitly dispatch next retrieval iteration
        if: steps.state.outputs.repair_needed == 'true' && steps.caps.outputs.allow_scientific == 'true' && steps.caps.outputs.allow_proposal == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run retrieval-before-reasoning-experiment.yml \
            --ref agent/retrieval-before-reasoning-clean

      - name: Stop for invalid benchmark
        if: steps.state.outputs.benchmark_valid == 'false'
        run: |
          echo "::error::Frozen A/B is incomplete because an arm hit an execution/budget/infrastructure stop. No retrieval code repair was attempted; fix benchmark execution before resuming optimisation."

      - name: Stop after scientific rejection cap
        if: steps.state.outputs.repair_needed == 'true' && steps.caps.outputs.allow_scientific == 'false'
        run: |
          echo "::warning::Autonomous retrieval search stopped after 20 corpus-tested rejected hypotheses. Human review is required before spending more API budget."

      - name: Stop after proposal failure cap
        if: steps.state.outputs.repair_needed == 'true' && steps.caps.outputs.allow_proposal == 'false'
        run: |
          echo "::warning::Autonomous retrieval search stopped after 5 proposal-generation failures under the new optimiser. Human review of diagnostic sufficiency is required."

      - name: Report promotion-ready state
        if: steps.state.outputs.passed == 'true'
        run: |
          echo "Current retrieval architecture passed canary and the full 44-paper frozen A/B. Autonomous search stops for human promotion/merge review."

      - name: Upload iteration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-autonomous-${{ github.run_id }}
          path: artifacts
          retention-days: 30
