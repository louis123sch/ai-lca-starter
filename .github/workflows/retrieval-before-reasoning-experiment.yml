name: Retrieval-before-reasoning frozen-corpus A/B

on:
  pull_request:
    branches: [main]
    paths:
      - "src/ai_lca/evidence_router.py"
      - "src/ai_lca/retrieval_processor.py"
      - "src/ai_lca/retrieval_replay.py"
      - "src/ai_lca/retrieval_compare.py"
      - "tests/test_evidence_router.py"
      - "tests/test_retrieval_compare.py"
      - ".github/workflows/retrieval-before-reasoning-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  SPRINGER_API_KEY: ${{ secrets.SPRINGER_API_KEY }}
  OPENAI_MODEL: gpt-5-mini
  OPENAI_SCREEN_MODEL: gpt-5-nano
  BASELINE_RUN_ID: "31473783816"
  BASELINE_ARTIFACT: "phase1-scale-31473783816"

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Check out retrieval experiment
        uses: actions/checkout@v4
        with:
          ref: agent/retrieval-before-reasoning-clean
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Verify experiment secrets
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "::error::OPENAI_API_KEY missing"; exit 2; }

      - name: Download exact frozen corpus
        uses: actions/download-artifact@v4
        with:
          name: phase1-scale-31473783816
          path: frozen_corpus
          repository: louis123sch/ai-lca-starter
          run-id: 31473783816
          github-token: ${{ github.token }}

      - name: Run deterministic tests
        run: |
          python -m compileall -q app.py src tests
          python -m pytest -q

      - name: Audit router against all 44 frozen papers before any API calls
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          from pathlib import Path
          from ai_lca.inventory_replay import select_dois
          from ai_lca.retrieval_replay import audit_router
          from ai_lca.corpus_diagnostics import BASELINE_MANIFEST

          state = Path('frozen_corpus')
          dois = select_dois(state_dir=state, manifest=BASELINE_MANIFEST, subset='full')
          audit = audit_router(state, BASELINE_MANIFEST, dois)
          Path('artifacts/router_audit_full.json').write_text(json.dumps(audit, indent=2) + '\n', encoding='utf-8')
          summary = {k: v for k, v in audit.items() if k != 'per_paper'}
          print(json.dumps(summary, indent=2))
          assert audit['paper_count'] == 44, audit['paper_count']
          assert audit['inventory_safety_pass'], audit
          assert audit['unsafe_exclusion_count'] == 0, audit
          PY

      - name: Prepare independent canary control and retrieval states
        run: |
          cp -a frozen_corpus control_canary_state
          cp -a frozen_corpus routed_canary_state

      - name: Run existing replay control on canary
        id: control_canary
        continue-on-error: true
        run: |
          python -m ai_lca.inventory_replay \
            --state-dir control_canary_state \
            --subset canary \
            --max-total-calls 30 \
            --max-calls-per-paper 7 \
            --max-total-tokens 500000 \
            --max-estimated-cost-usd 0.45 \
            --output artifacts/control_canary.json

      - name: Run production-equivalent retrieval replay on identical canary
        id: routed_canary
        continue-on-error: true
        run: |
          python -m ai_lca.retrieval_replay \
            --state-dir routed_canary_state \
            --subset canary \
            --max-total-calls 30 \
            --max-calls-per-paper 7 \
            --max-total-tokens 500000 \
            --max-estimated-cost-usd 0.45 \
            --output artifacts/routed_canary.json

      - name: Gate retrieval against canary control
        id: canary_gate
        run: |
          python -m ai_lca.retrieval_compare \
            --control artifacts/control_canary.json \
            --routed artifacts/routed_canary.json \
            --control-state control_canary_state \
            --routed-state routed_canary_state \
            --output artifacts/canary_comparison.json

      - name: Prepare independent full-corpus control and retrieval states
        if: steps.canary_gate.outcome == 'success'
        run: |
          cp -a frozen_corpus control_full_state
          cp -a frozen_corpus routed_full_state

      - name: Run existing replay control on all 44 papers
        if: steps.canary_gate.outcome == 'success'
        id: control_full
        continue-on-error: true
        run: |
          python -m ai_lca.inventory_replay \
            --state-dir control_full_state \
            --subset full \
            --max-total-calls 110 \
            --max-calls-per-paper 8 \
            --max-total-tokens 2000000 \
            --max-estimated-cost-usd 1.50 \
            --output artifacts/control_full.json

      - name: Run production-equivalent retrieval replay on all 44 papers
        if: steps.canary_gate.outcome == 'success'
        id: routed_full
        continue-on-error: true
        run: |
          python -m ai_lca.retrieval_replay \
            --state-dir routed_full_state \
            --subset full \
            --max-total-calls 110 \
            --max-calls-per-paper 8 \
            --max-total-tokens 2000000 \
            --max-estimated-cost-usd 1.50 \
            --output artifacts/routed_full.json

      - name: Gate retrieval against full control
        if: steps.canary_gate.outcome == 'success'
        run: |
          python -m ai_lca.retrieval_compare \
            --control artifacts/control_full.json \
            --routed artifacts/routed_full.json \
            --control-state control_full_state \
            --routed-state routed_full_state \
            --output artifacts/full_comparison.json

      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-before-reasoning-${{ github.run_id }}
          path: artifacts
          retention-days: 30
