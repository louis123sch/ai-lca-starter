name: Yang general repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/yang-general-repair.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ai-lca-yang-general-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_REPAIR_MODEL: gpt-5-mini
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 12

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Download latest Yang diagnostic artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repair_input
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/9047948632/zip > /tmp/yang.zip
          unzip -q /tmp/yang.zip -d repair_input
          test -f repair_input/summary.json

      - name: Ask conservative repair agent for one general change
        id: repair
        shell: bash
        run: |
          python -m ai_lca.repair_agent \
            --benchmark-root repair_input \
            --source benchmarks/yang_2024/source_excerpt.txt \
            --result repair_result.json
          cat repair_result.json
          CHANGED="$(python -c 'import json; print(str(json.load(open("repair_result.json"))["changed"]).lower())')"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Run deterministic tests
        if: steps.repair.outputs.changed == 'true'
        env:
          OPENAI_API_KEY: ""
          GH_TOKEN: ""
        run: python -m pytest -q

      - name: Commit validated general repair
        if: steps.repair.outputs.changed == 'true'
        id: commit
        shell: bash
        run: |
          git config user.name "ai-lca-benchmark-bot"
          git config user.email "ai-lca-benchmark-bot@users.noreply.github.com"
          git add src/ai_lca/llm.py
          git commit -m "general repair: reduce unsupported foreground over-decomposition"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch regression pair
        if: steps.repair.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="${{ steps.commit.outputs.sha }}"
          for _ in $(seq 1 40); do
            REMOTE_SHA="$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)"
            [ "$REMOTE_SHA" = "$HEAD_SHA" ] && break
            sleep 3
          done
          gh workflow run gerloff-benchmark.yml --repo "$GITHUB_REPOSITORY" --ref main -f runs=3
          gh workflow run hermesmann-benchmark.yml --repo "$GITHUB_REPOSITORY" --ref main -f runs=3

      - name: Wait for regression pair and resume Yang only if both pass
        if: steps.repair.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="${{ steps.commit.outputs.sha }}"
          latest_for_head() {
            local workflow="$1"
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main --limit 40 \
              --json databaseId,headSha,status,conclusion,createdAt \
              | jq -c --arg SHA "$HEAD_SHA" '[.[] | select(.headSha == $SHA)] | sort_by(.createdAt) | last // {}'
          }
          G='{}'; H='{}'
          for _ in $(seq 1 300); do
            G="$(latest_for_head gerloff-benchmark.yml)"
            H="$(latest_for_head hermesmann-benchmark.yml)"
            GS="$(jq -r '.status // ""' <<<"$G")"
            HS="$(jq -r '.status // ""' <<<"$H")"
            if [ "$GS" = completed ] && [ "$HS" = completed ]; then break; fi
            sleep 15
          done
          GC="$(jq -r '.conclusion // empty' <<<"$G")"
          HC="$(jq -r '.conclusion // empty' <<<"$H")"
          echo "Gerloff: $GC"
          echo "Hermesmann: $HC"
          if [ "$GC" = success ] && [ "$HC" = success ]; then
            gh workflow run benchmark-003.yml --repo "$GITHUB_REPOSITORY" --ref main -f runs=3
          else
            echo "Regression pair did not both pass; holding progression."
          fi

      - name: No-change diagnosis
        if: steps.repair.outputs.changed != 'true'
        run: cat repair_result.json
