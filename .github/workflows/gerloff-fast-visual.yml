name: Gerloff fast visual regression

on:
  push:
    branches:
      - feat/gerloff-fast-visual-regression
    paths:
      - "src/ai_lca/llm.py"
      - "src/ai_lca/documents.py"
      - "src/ai_lca/benchmark_visual_evidence.py"
      - "src/ai_lca/benchmark_visual_to_flows.py"
      - "src/ai_lca/benchmark_context_dilution.py"
      - "src/ai_lca/benchmark_text_inventory_lists.py"
      - "tests/test_visual_evidence_benchmark.py"
      - "benchmarks/gerloff_2021/build_visual_fixture.py"
      - "benchmarks/gerloff_2021/visual_flows.csv"
      - ".github/workflows/gerloff-fast-visual.yml"
  workflow_dispatch:

concurrency:
  group: gerloff-fast-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_VISION_MODEL: gpt-5-mini
      OPENAI_MODEL: gpt-5-mini

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Run deterministic scorer tests
        run: python -m pytest -q tests/test_visual_evidence_benchmark.py

      - name: Verify OpenAI secret exists
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Repository secret OPENAI_API_KEY is missing."
            exit 2
          fi

      - name: Build image-only Gerloff fixture
        run: python benchmarks/gerloff_2021/build_visual_fixture.py

      - name: Run visual transcription regression
        run: |
          python -m ai_lca.benchmark_visual_evidence \
            --source benchmarks/gerloff_2021/source_visual_inventory.docx \
            --expected benchmarks/gerloff_2021/visual_flows.csv \
            --model "$OPENAI_VISION_MODEL" \
            --max-visual-assets 8 \
            --min-recall 0.95 \
            --output benchmark_runs/gerloff_2021/fast_visual_report.json

      - name: Run visual-to-flow regression
        run: |
          python -m ai_lca.benchmark_visual_to_flows \
            --source benchmarks/gerloff_2021/source_visual_inventory.docx \
            --expected benchmarks/gerloff_2021/visual_flows.csv \
            --model "$OPENAI_MODEL" \
            --max-visual-assets 8 \
            --min-recall 0.95 \
            --min-precision 0.95 \
            --output benchmark_runs/gerloff_2021/fast_visual_to_flow_report.json

      - name: Run focused machine-readable inventory-list regression
        run: |
          python -m ai_lca.benchmark_text_inventory_lists \
            --source benchmarks/gerloff_2021/source_main_excerpt.txt \
            --expected benchmarks/gerloff_2021/flows.csv \
            --model "$OPENAI_MODEL" \
            --min-recall 0.95 \
            --min-precision 0.95 \
            --output benchmark_runs/gerloff_2021/fast_text_list_report.json

      - name: Diagnose full-context dilution of visual rows
        continue-on-error: true
        run: |
          timeout 600s python -m ai_lca.benchmark_context_dilution \
            --visual-source benchmarks/gerloff_2021/source_visual_inventory.docx \
            --text-source benchmarks/gerloff_2021/source_main_excerpt.txt \
            --text-source benchmarks/gerloff_2021/source_supplement_machine_readable.txt \
            --expected benchmarks/gerloff_2021/visual_flows.csv \
            --model "$OPENAI_MODEL" \
            --min-recall 0.95 \
            --output benchmark_runs/gerloff_2021/context_dilution_report.json

      - name: Upload fast visual reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gerloff-fast-visual-${{ github.run_id }}
          path: |
            benchmark_runs/gerloff_2021/fast_visual_report.json
            benchmark_runs/gerloff_2021/fast_visual_to_flow_report.json
            benchmark_runs/gerloff_2021/fast_text_list_report.json
            benchmark_runs/gerloff_2021/context_dilution_report.json
          if-no-files-found: warn
          retention-days: 30
