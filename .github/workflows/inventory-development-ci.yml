name: Inventory development deterministic CI

on:
  push:
    branches: [inventory-recall-development]
  pull_request:
    paths:
      - "src/ai_lca/**"
      - "tests/**"
      - ".github/workflows/inventory-development-ci.yml"

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and tests
        run: python -m pip install -e ".[test]"
      - name: Compile
        run: python -m compileall -q app.py src tests
      - name: Run deterministic suite
        run: python -m pytest -q
