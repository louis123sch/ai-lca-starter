name: Apply validated LCIA assignment fix

on:
  push:
    branches: [agent/fix-lcia-result-inventory-classification]
    paths:
      - ".github/workflows/apply-lcia-assignment-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-lcia-result-inventory-classification
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply exact prompt strengthening
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/ai_lca/autonomous_literature.py')
          text = path.read_text(encoding='utf-8')
          old = '''ASSIGN_SYSTEM_PROMPT = """You are assigning deterministically enumerated LCI evidence rows to an already locked foreground process graph. You may not add, split, merge, or rename processes.
          For EVERY candidate_id supplied choose modeled_inventory, not_inventory, or ambiguous. A modeled_inventory row may belong to multiple supplied process IDs when it genuinely contains values for multiple assessed alternatives. Use only supplied process IDs. Results/impact tables and descriptive parameters are not inventory. Return exactly one assignment per candidate_id."""'''.replace('          ', '')
          new = '''ASSIGN_SYSTEM_PROMPT = """You are assigning deterministically enumerated LCI evidence rows to an already locked foreground process graph. You may not add, split, merge, or rename processes.
          For EVERY candidate_id supplied choose modeled_inventory, not_inventory, or ambiguous. A modeled_inventory row may belong to multiple supplied process IDs when it genuinely contains values for multiple assessed alternatives. Use only supplied process IDs.
          Results/impact tables and descriptive parameters are not inventory. In particular, LCIA midpoint or endpoint result rows such as GWP/climate-change scores, acidification, eutrophication, toxicity, depletion/resource scores, or other characterized impact-category values must be not_inventory, even when reported per functional unit or per assessed alternative. Do not confuse a CO2-equivalent impact score with a direct elementary CO2 emission from an actual LCI input/output table.
          When a candidate is not_inventory, process_ids must be empty. Candidate IDs are opaque source identifiers: copy only supplied candidate_ids exactly and never invent wildcard or placeholder IDs. Return exactly one assignment per supplied candidate_id and no others."""'''.replace('          ', '')
          if old not in text:
              raise SystemExit('Expected ASSIGN_SYSTEM_PROMPT block not found; refusing to edit')
          if text.count(old) != 1:
              raise SystemExit('ASSIGN_SYSTEM_PROMPT block was not unique; refusing to edit')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate production reader
        run: |
          python -m pip install -e ".[test]"
          python -m compileall -q src tests
          python -m pytest -q tests/test_autonomous_literature.py
      - name: Commit production fix
        run: |
          git config user.name "ai-lca-controlled-accuracy"
          git config user.email "actions@users.noreply.github.com"
          git add src/ai_lca/autonomous_literature.py
          git diff --cached --quiet && { echo "::error::No production prompt change found"; exit 3; }
          git commit -m "Prevent LCIA results from becoming inventory flows"
          git push origin HEAD:agent/fix-lcia-result-inventory-classification
