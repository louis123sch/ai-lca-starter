name: Random-44 locked-structure flow isolation

on:
  push:
    branches: [agent/document-reader-random44-1]
    paths:
      - '.control/random44-reader-isolation'

permissions:
  contents: read
  actions: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5-mini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[test]'
      - name: Deterministic preflight
        run: python -m pytest -q
      - name: Verify OpenAI secret
        run: test -n "$OPENAI_API_KEY"
      - name: Download frozen 44-paper corpus
        uses: actions/download-artifact@v4
        with:
          name: phase1-scale-31473783816
          path: frozen_corpus
          github-token: ${{ github.token }}
          run-id: 31473783816
      - name: Download previous target baseline
        uses: actions/download-artifact@v4
        with:
          name: random44-reader-31584766001
          path: previous_target
          github-token: ${{ github.token }}
          run-id: 31584766001
      - name: Reread flows with locked baseline structure
        run: |
          python scripts/random44_flow_isolation.py \
            --artifact-root frozen_corpus \
            --previous-root previous_target \
            --output-dir random44_flow_isolation \
            --model "$OPENAI_MODEL"
      - name: Upload isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: random44-flow-isolation-${{ github.run_id }}
          path: random44_flow_isolation
          if-no-files-found: warn
          retention-days: 30
