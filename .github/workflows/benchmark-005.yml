name: Benchmark 005

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Number of independent LLM extraction runs"
        required: false
        default: "3"
      frozen_sha:
        description: "Frozen extractor commit SHA; required for holdout validity"
        required: true

concurrency:
  group: benchmark-005-${{ github.event.inputs.frozen_sha }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5-mini
      AI_LCA_INFRA_RETRY_ATTEMPTS: "3"
      AI_LCA_INFRA_RETRY_BASE_DELAY_SECONDS: "15"
      FROZEN_SHA: ${{ github.event.inputs.frozen_sha }}
    steps:
      - name: Check out frozen extractor
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_SHA }}
      - name: Verify frozen checkout
        run: test "$(git rev-parse HEAD)" = "$FROZEN_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - name: Deterministic tests
        run: python -m pytest -q
      - name: Verify OpenAI secret
        run: test -n "$OPENAI_API_KEY"
      - name: Run Benchmark 005 holdout
        id: extraction
        shell: bash
        run: |
          RUNS="${{ github.event.inputs.runs }}"; [ -n "$RUNS" ] || RUNS=3
          echo "HOLDOUT: no extractor/prompt changes may be made based on this result before Benchmark 006 runs on $FROZEN_SHA"
          bash scripts/run_resilient_benchmark.sh \
            python -m ai_lca.benchmark live \
              --expected benchmarks/afzal_2023/expected.json \
              --source benchmarks/afzal_2023/source_excerpt.txt \
              --runs "$RUNS" --model "$OPENAI_MODEL" \
              --output-dir benchmark_runs/afzal_2023
      - name: Enforce standard quality gate
        if: steps.extraction.outcome == 'success'
        continue-on-error: true
        id: quality
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('benchmark_runs/afzal_2023/summary.json').read_text())
          checks=[('mean overall',s['mean_overall_score'],.85),('minimum run',s['min_overall_score'],.80),('process recall',s['mean_process_recall'],.90),('process precision',s['mean_process_precision'],.90),('flow recall',s['mean_flow_recall'],.85),('flow precision',s['mean_flow_precision'],.85)]
          failed=[f'{n} {v:.3f} < {t:.3f}' for n,v,t in checks if float(v)<t]
          print(json.dumps(s,indent=2))
          if failed:
              print('\n'.join(failed)); raise SystemExit(1)
          PY
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-005-holdout-${{ env.FROZEN_SHA }}-${{ github.run_id }}
          path: benchmark_runs/afzal_2023
          if-no-files-found: warn
          retention-days: 30
      - name: Run final holdout on the identical frozen extractor
        if: steps.extraction.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run benchmark-006.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f runs=3 -f frozen_sha="$FROZEN_SHA"
      - name: Preserve Benchmark 005 quality outcome
        if: steps.extraction.outcome == 'success' && steps.quality.outcome == 'failure'
        run: |
          echo "Benchmark 005 holdout failed its quality gate. Benchmark 006 was still dispatched on the identical frozen extractor as required."
          exit 1
