name: Apply final iteration 9

on:
  push:
    branches:
      - "final/iteration-9-reader"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: "final/iteration-9-reader"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact tested patch and validate
        shell: bash
        run: |
          if grep -q "activity-owned quantitative LCI rows" src/ai_lca/llm.py; then
            echo "Iteration 9 production patch already applied"
            exit 0
          fi
          git apply --check .final/iteration9.patch
          git apply .final/iteration9.patch
          git diff --check
          python -m pip install -e ".[test]"
          python -m pytest -q
          git config user.name ai-lca-finalizer
          git config user.email actions@users.noreply.github.com
          git add src/ai_lca/llm.py tests/test_benchmark.py
          git commit -m "Adopt final iteration 9 reader patch"
          git push origin HEAD:final/iteration-9-reader
