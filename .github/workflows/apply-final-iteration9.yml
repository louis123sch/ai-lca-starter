name: Apply final iteration 9
on:
  push:
    branches:
      - final/iteration-9-reader
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final/iteration-9-reader
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Apply exact tested iteration 9 patch
        env:
          PATCH_B64: 
      - name: Apply, test and commit
        run: |
          if grep -q "activity-owned quantitative LCI rows" src/ai_lca/llm.py; then
            echo "Iteration 9 patch already applied"
            exit 0
          fi
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/iteration9.diff
          git apply --check /tmp/iteration9.diff
          git apply /tmp/iteration9.diff
          git diff --check
          python -m pytest -q
          git config user.name ai-lca-finalizer
          git config user.email actions@users.noreply.github.com
          git add src/ai_lca/llm.py tests/test_benchmark.py
          git commit -m "Adopt final iteration 9 reader patch"
          git push origin HEAD:final/iteration-9-reader
