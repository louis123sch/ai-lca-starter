name: Autonomous inventory recall development

on:
  workflow_dispatch:
    inputs:
      run_iteration:
        description: "Run one autonomous inventory iteration and continue the chain"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: inventory-recall-autonomous-development
  cancel-in-progress: false

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  SPRINGER_API_KEY: ${{ secrets.SPRINGER_API_KEY }}
  OPENAI_MODEL: gpt-5-mini
  OPENAI_SCREEN_MODEL: gpt-5-nano
  OPENAI_REPAIR_MODEL: gpt-5-mini
  OPENAI_REQUEST_TIMEOUT_SECONDS: "180"
  BASELINE_RUN_ID: "31473783816"
  BASELINE_ARTIFACT: "phase1-scale-31473783816"
  BASELINE_ID: "corpus_baseline_v1_1_2026-08-11"
  DEVELOPMENT_BRANCH: "inventory-recall-development"

jobs:
  iterate:
    if: ${{ inputs.run_iteration == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: inventory-recall-development
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore frozen corpus cache
        id: corpus-cache
        uses: actions/cache@v4
        with:
          path: corpus_baseline_state
          key: corpus-baseline-v1-1-2026-08-11-artifact-9094408729

      - name: Seed frozen corpus from baseline artifact
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: phase1-scale-31473783816
          path: corpus_baseline_state
          repository: louis123sch/ai-lca-starter
          run-id: 31473783816
          github-token: ${{ github.token }}

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Verify API secret
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "::error::OPENAI_API_KEY missing"; exit 2; }

      - name: Run deterministic baseline tests
        run: |
          python -m compileall -q app.py src tests
          python -m pytest -q

      - name: Diagnose exact frozen corpus without API calls
        run: |
          rm -rf literature_state
          cp -a corpus_baseline_state literature_state
          mkdir -p artifacts
          python -m ai_lca.corpus_diagnostics \
            --state-dir literature_state \
            --output artifacts/corpus_diagnostics.json
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          report=json.load(open('artifacts/corpus_diagnostics.json'))
          assert report['baseline_id'] == 'corpus_baseline_v1_1_2026-08-11', report['baseline_id']
          assert report['paper_count'] == 44, report['paper_count']
          assert report['status_counts'] == {'COMPLETE': 7, 'UNRESOLVED_INVENTORY': 37} or report['status_counts'] == {'UNRESOLVED_INVENTORY': 37, 'COMPLETE': 7}, report['status_counts']
          top=report['failure_class_ranking'][0]
          print('TARGET_FAILURE_CLASS='+top['failure_class'])
          print('TARGET_AFFECTED_PAPERS='+str(top['affected_papers']))
          PY

      - name: Propose one bounded general repair
        run: |
          python -m ai_lca.autonomous_continuous_iteration \
            --diagnostics artifacts/corpus_diagnostics.json \
            --failure-class "$TARGET_FAILURE_CLASS" \
            --model "$OPENAI_REPAIR_MODEL" \
            --reasoning-effort medium \
            --max-context-chars 90000 \
            --max-proposal-attempts 3 \
            --history-file .autonomy/inventory_rejection_history.jsonl \
            --max-history-entries 12 \
            --output-dir artifacts/autonomous_iteration

      - name: Detect proposed code change
        id: repair_change
        shell: bash
        run: |
          if git diff --quiet -- src/ai_lca tests; then
            echo "has_change=false" >> "$GITHUB_OUTPUT"
            echo "No valid bounded repair was produced. Expensive corpus gates will be skipped for this cycle."
          else
            echo "has_change=true" >> "$GITHUB_OUTPUT"
            echo "A bounded repair was applied. Proceeding through corpus gates."
          fi

      - name: Micro gate
        id: micro_gate
        if: steps.repair_change.outputs.has_change == 'true'
        continue-on-error: true
        run: |
          rm -rf literature_state
          cp -a corpus_baseline_state literature_state
          python -m ai_lca.inventory_micro \
            --state-dir literature_state \
            --subset canary \
            --max-total-calls 15 \
            --max-calls-per-paper 6 \
            --max-total-tokens 250000 \
            --max-estimated-cost-usd 0.25 \
            --output artifacts/micro.json

      - name: Canary gate
        id: canary_gate
        if: steps.repair_change.outputs.has_change == 'true' && steps.micro_gate.outcome == 'success'
        continue-on-error: true
        run: |
          rm -rf literature_state
          cp -a corpus_baseline_state literature_state
          python -m ai_lca.inventory_replay \
            --state-dir literature_state \
            --subset canary \
            --max-total-calls 30 \
            --max-calls-per-paper 7 \
            --max-total-tokens 500000 \
            --max-estimated-cost-usd 0.45 \
            --output artifacts/canary.json

      - name: Affected-cohort gate
        id: cohort_gate
        if: steps.repair_change.outputs.has_change == 'true' && steps.micro_gate.outcome == 'success' && steps.canary_gate.outcome == 'success'
        continue-on-error: true
        run: |
          rm -rf literature_state
          cp -a corpus_baseline_state literature_state
          python -m ai_lca.inventory_replay \
            --state-dir literature_state \
            --subset cohort \
            --cohort "$TARGET_FAILURE_CLASS" \
            --max-total-calls 60 \
            --max-calls-per-paper 8 \
            --max-total-tokens 1000000 \
            --max-estimated-cost-usd 0.90 \
            --output artifacts/cohort.json

      - name: Full 44-paper regression gate
        id: full_gate
        if: steps.repair_change.outputs.has_change == 'true' && steps.micro_gate.outcome == 'success' && steps.canary_gate.outcome == 'success' && steps.cohort_gate.outcome == 'success'
        continue-on-error: true
        run: |
          rm -rf literature_state
          cp -a corpus_baseline_state literature_state
          python -m ai_lca.inventory_replay \
            --state-dir literature_state \
            --subset full \
            --max-total-calls 110 \
            --max-calls-per-paper 8 \
            --max-total-tokens 2000000 \
            --max-estimated-cost-usd 1.50 \
            --output artifacts/full_regression.json

      - name: Report rejected repair
        if: always() && steps.repair_change.outputs.has_change == 'true' && (steps.micro_gate.outcome == 'failure' || steps.canary_gate.outcome == 'failure' || steps.cohort_gate.outcome == 'failure' || steps.full_gate.outcome == 'failure')
        shell: bash
        run: |
          echo "::notice::Candidate repair was safely rejected by the corpus gates; no code will be committed."
          echo "micro=${{ steps.micro_gate.outcome }} canary=${{ steps.canary_gate.outcome }} cohort=${{ steps.cohort_gate.outcome }} full=${{ steps.full_gate.outcome }}"

      - name: Record rejected experiment memory
        if: always() && steps.repair_change.outputs.has_change == 'true' && (steps.micro_gate.outcome == 'failure' || steps.canary_gate.outcome == 'failure' || steps.cohort_gate.outcome == 'failure' || steps.full_gate.outcome == 'failure')
        env:
          MICRO_OUTCOME: ${{ steps.micro_gate.outcome }}
          CANARY_OUTCOME: ${{ steps.canary_gate.outcome }}
          COHORT_OUTCOME: ${{ steps.cohort_gate.outcome }}
          FULL_OUTCOME: ${{ steps.full_gate.outcome }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          outcomes = [
              ("micro", os.environ.get("MICRO_OUTCOME"), Path("artifacts/micro.json")),
              ("canary", os.environ.get("CANARY_OUTCOME"), Path("artifacts/canary.json")),
              ("cohort", os.environ.get("COHORT_OUTCOME"), Path("artifacts/cohort.json")),
              ("full", os.environ.get("FULL_OUTCOME"), Path("artifacts/full_regression.json")),
          ]
          gate_name, _, gate_path = next(item for item in outcomes if item[1] == "failure")
          iteration = json.loads(Path("artifacts/autonomous_iteration/iteration.json").read_text(encoding="utf-8"))
          gate = json.loads(gate_path.read_text(encoding="utf-8")) if gate_path.exists() else {}
          regressions = gate.get("comparison", {}).get("regressions", [])
          reasons = sorted({str(item.get("reason")) for item in regressions if item.get("reason")})
          record = {
              "run_id": os.environ.get("RUN_ID"),
              "failure_class": iteration.get("failure_class"),
              "summary": iteration.get("summary"),
              "rationale": iteration.get("rationale"),
              "rejected_at_gate": gate_name,
              "regression_reasons": reasons,
          }
          history = Path(".autonomy/inventory_rejection_history.jsonl")
          history.parent.mkdir(parents=True, exist_ok=True)
          with history.open("a", encoding="utf-8") as handle:
              handle.write(json.dumps(record, sort_keys=True) + "\n")
          PY
          git restore -- src/ai_lca tests
          git config user.name "ai-lca-autonomous-development"
          git config user.email "actions@users.noreply.github.com"
          git add .autonomy/inventory_rejection_history.jsonl
          git diff --cached --quiet || git commit -m "Record rejected inventory experiment"
          git push origin HEAD:inventory-recall-development

      - name: Commit accepted development repair
        if: steps.repair_change.outputs.has_change == 'true' && steps.full_gate.outcome == 'success'
        shell: bash
        run: |
          git config user.name "ai-lca-autonomous-development"
          git config user.email "actions@users.noreply.github.com"
          git add src/ai_lca tests
          git diff --cached --quiet && { echo "::error::No allowed source/test change staged."; exit 5; }
          git commit -m "Improve inventory recall: $TARGET_FAILURE_CLASS"
          git push origin HEAD:inventory-recall-development

      - name: Open or update draft promotion PR
        if: steps.repair_change.outputs.has_change == 'true' && steps.full_gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PR_NUMBER="$(gh pr list --head inventory-recall-development --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --draft \
              --base main \
              --head inventory-recall-development \
              --title "Validated corpus-driven inventory recall improvements" \
              --body "Autonomous development changes that passed deterministic tests, micro replay, the 8-paper canary, the affected failure cohort, and the full 44-paper regression. Promotion remains human-reviewed; no automatic merge to main."
          else
            gh pr comment "$PR_NUMBER" --body "Accepted another bounded iteration for **$TARGET_FAILURE_CLASS** after all four corpus gates passed. The branch has been updated; promotion remains manual."
          fi

      - name: Upload iteration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-iteration-${{ github.run_id }}
          path: artifacts
          retention-days: 30

      - name: Queue next autonomous iteration
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gh workflow run inventory-autonomous-development.yml --ref main -f run_iteration=true; then
              echo "Queued the next autonomous inventory iteration."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Could not queue the next autonomous iteration after three attempts."
          exit 1
