name: Autonomous benchmark improvement loop

on:
  workflow_dispatch:
  push:
    branches:
      - agent/autonomous-benchmark-loop
    paths:
      - .autonomy/restart_signal

permissions:
  contents: write

concurrency:
  group: autonomous-benchmark-improvement-loop
  cancel-in-progress: true

env:
  OPENAI_MODEL: gpt-5.6
  OPENAI_VISION_MODEL: gpt-5.6
  OPENAI_REASONING_EFFORT: medium
  OPENAI_REPAIR_MODEL: gpt-5.6
  OPENAI_REPAIR_REASONING_EFFORT: xhigh

jobs:
  iterate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout autonomous branch
        uses: actions/checkout@v4
        with:
          ref: agent/autonomous-benchmark-loop
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Configure diagnosis and paper-level acceptance gates
        run: python scripts/configure_autonomous_loop.py

      - name: Persist loop-control configuration
        run: |
          git config user.name ai-lca-autonomous-benchmark
          git config user.email actions@users.noreply.github.com
          git add src/ai_lca/autonomous_benchmark_loop.py tests/test_autonomous_benchmark_gates.py
          if ! git diff --cached --quiet; then
            git commit -m "Use paper-level overall scores for autonomous acceptance"
            git push origin HEAD:agent/autonomous-benchmark-loop
          fi

      - name: Verify OpenAI secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY"

      - name: Run deterministic tests
        run: python -m pytest -q

      - name: Prepare exactly one monitored iteration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.autonomy/benchmark_loop_state.json')
          state = json.loads(path.read_text(encoding='utf-8'))
          current = int(state.get('iteration', 0))
          state['status'] = 'active'
          state['last_result'] = 'monitored_iteration_queued'
          state['max_iterations'] = current + 1
          path.write_text(json.dumps(state, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(f'Prepared monitored iteration {current + 1}')
          PY

      - name: Diagnose, patch and benchmark one iteration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m ai_lca.autonomous_benchmark_loop --max-iterations 999

      - name: Upload loop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-benchmark-loop-${{ github.run_id }}
          path: |
            artifacts/autonomous_benchmark_loop
            .autonomy/benchmark_loop_state.json
            .autonomy/benchmark_rejection_history.jsonl
            .autonomy/external_validation_lessons.json
          if-no-files-found: warn
          retention-days: 30
