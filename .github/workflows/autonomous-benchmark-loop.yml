name: Autonomous benchmark improvement loop

on:
  push:
    branches:
      - agent/autonomous-benchmark-loop
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autonomous-benchmark-improvement-loop
  cancel-in-progress: true

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_MODEL: gpt-5.6
  OPENAI_VISION_MODEL: gpt-5.6
  OPENAI_REASONING_EFFORT: medium
  OPENAI_REPAIR_MODEL: gpt-5.6
  OPENAI_REPAIR_REASONING_EFFORT: xhigh
  AI_LCA_INFRA_RETRY_ATTEMPTS: "3"
  AI_LCA_INFRA_RETRY_BASE_DELAY_SECONDS: "15"

jobs:
  iterate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out autonomous development branch
        uses: actions/checkout@v4
        with:
          ref: agent/autonomous-benchmark-loop
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Verify OpenAI secret
        run: test -n "$OPENAI_API_KEY"

      - name: Configure incremental gates and GPT-5.6 medium reader
        run: |
          python - <<'PY'
          import importlib
          import json
          from pathlib import Path

          # Reader/extractor: add medium reasoning only to the three actual
          # OpenAI Structured Output calls, never to internal Python calls.
          llm_path = Path("src/ai_lca/llm.py")
          llm = llm_path.read_text(encoding="utf-8")
          effort_line = 'reasoning_effort=os.getenv("OPENAI_REASONING_EFFORT", "medium"),'
          if effort_line not in llm:
              visual_old = '''        completion = client.beta.chat.completions.parse(
              model=chosen_model,
          '''
              visual_new = '''        completion = client.beta.chat.completions.parse(
              model=chosen_model,
              reasoning_effort=os.getenv("OPENAI_REASONING_EFFORT", "medium"),
          '''
              text_old = '''    completion = _client(api_key).beta.chat.completions.parse(
          model=chosen_model,
      '''
              text_new = '''    completion = _client(api_key).beta.chat.completions.parse(
          model=chosen_model,
          reasoning_effort=os.getenv("OPENAI_REASONING_EFFORT", "medium"),
      '''
              if llm.count(visual_old) != 1:
                  raise RuntimeError(f"Expected one visual reader API call, found {llm.count(visual_old)}")
              if llm.count(text_old) != 2:
                  raise RuntimeError(f"Expected two text reader API calls, found {llm.count(text_old)}")
              llm = llm.replace(visual_old, visual_new, 1)
              llm = llm.replace(text_old, text_new, 2)
              llm_path.write_text(llm, encoding="utf-8")
          if llm_path.read_text(encoding="utf-8").count(effort_line) != 3:
              raise RuntimeError("Reader reasoning-effort configuration is inconsistent")

          # Acceptance logic: absolute thresholds are final success floors, not
          # a requirement for every intermediate candidate. A metric that has
          # already crossed its floor can never fall back below it, and no
          # accepted metric may regress below its accepted baseline.
          loop_path = Path("src/ai_lca/autonomous_benchmark_loop.py")
          loop = loop_path.read_text(encoding="utf-8")
          old_gate = '''def _threshold_failures(
              summaries: dict[str, dict[str, Any]],
              baseline: dict[str, dict[str, Any]],
          ) -> list[str]:
              failures: list[str] = []
              for name, summary in summaries.items():
                  base = baseline[name]
                  for metric, threshold in ABSOLUTE_THRESHOLDS.items():
                      value = float(summary[metric])
                      if value < threshold:
                          failures.append(f"{name}: absolute {metric} {value:.4f} < {threshold:.4f}")
                      base_value = float(base[metric])
                      if value + NO_REGRESSION_TOLERANCE < base_value:
                          failures.append(
                              f"{name}: regression {metric} {value:.4f} < accepted {base_value:.4f}"
                          )
              return failures
          '''
          new_gate = '''def _threshold_failures(
              summaries: dict[str, dict[str, Any]],
              baseline: dict[str, dict[str, Any]],
          ) -> list[str]:
              """Reject regressions while allowing monotonic progress toward final floors."""
              failures: list[str] = []
              for name, summary in summaries.items():
                  base = baseline[name]
                  for metric, threshold in ABSOLUTE_THRESHOLDS.items():
                      value = float(summary[metric])
                      base_value = float(base[metric])
                      if base_value >= threshold and value < threshold:
                          failures.append(
                              f"{name}: lost achieved absolute floor for {metric}: "
                              f"{value:.4f} < {threshold:.4f}"
                          )
                      if value + NO_REGRESSION_TOLERANCE < base_value:
                          failures.append(
                              f"{name}: regression {metric} {value:.4f} < accepted {base_value:.4f}"
                          )
              return failures
          '''
          if old_gate in loop:
              loop = loop.replace(old_gate, new_gate, 1)
          elif new_gate not in loop:
              raise RuntimeError("Could not locate threshold gate block")

          old_stop = '''def _all_absolute_pass(summaries: dict[str, dict[str, Any]]) -> bool:
              return not any(
                  float(summary[metric]) < threshold
                  for summary in summaries.values()
                  for metric, threshold in ABSOLUTE_THRESHOLDS.items()
              )
          '''
          new_stop = '''def _all_absolute_pass(summaries: dict[str, dict[str, Any]]) -> bool:
              """Final quality gate is determined by the development target only."""
              summary = summaries[TARGET_BENCHMARK]
              return not any(
                  float(summary[metric]) < threshold
                  for metric, threshold in ABSOLUTE_THRESHOLDS.items()
              )
          '''
          if old_stop in loop:
              loop = loop.replace(old_stop, new_stop, 1)
          elif new_stop not in loop:
              raise RuntimeError("Could not locate final absolute gate block")
          loop_path.write_text(loop, encoding="utf-8")

          # Re-open the completed six-iteration state for exactly one new
          # iteration. The loop will stop once iteration 7 is recorded.
          state_path = Path(".autonomy/benchmark_loop_state.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          if int(state.get("iteration", -1)) != 6:
              raise RuntimeError(f"Expected saved iteration 6, found {state.get('iteration')}")
          state["status"] = "active"
          state["max_iterations"] = 7
          state["last_result"] = "reopened_for_incremental_gate_test"
          state_path.write_text(json.dumps(state, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          # Deterministic gate tests before spending any API calls.
          mod = importlib.import_module("ai_lca.autonomous_benchmark_loop")
          base_target = {
              "benchmark_id": "mycelium_2024",
              "mean_overall_score": 0.4991736513414684,
              "mean_process_recall": 0.09523809523809523,
              "mean_process_precision": 1.0,
              "mean_flow_recall": 0.07017543859649122,
              "mean_flow_precision": 0.06557377049180328,
          }
          improved_target = {
              **base_target,
              "mean_overall_score": 0.5334611117958831,
              "mean_flow_recall": 0.08771929824561403,
              "mean_flow_precision": 0.08196721311475409,
          }
          assert mod._threshold_failures(
              {"mycelium_2024": improved_target},
              {"mycelium_2024": base_target},
          ) == []
          assert mod._target_improved(improved_target, base_target)

          terlouw_base = {
              "benchmark_id": "terlouw_2021",
              "mean_overall_score": 0.8037537810042349,
              "mean_process_recall": 1.0,
              "mean_process_precision": 1.0,
              "mean_flow_recall": 0.6551724137931034,
              "mean_flow_precision": 0.6333333333333333,
          }
          assert mod._threshold_failures(
              {"terlouw_2021": dict(terlouw_base)},
              {"terlouw_2021": terlouw_base},
          ) == []
          regressed_terlouw = dict(terlouw_base)
          regressed_terlouw["mean_flow_recall"] -= 0.001
          assert mod._threshold_failures(
              {"terlouw_2021": regressed_terlouw},
              {"terlouw_2021": terlouw_base},
          )

          assert not mod._all_absolute_pass({"mycelium_2024": base_target})
          final_target = dict(base_target)
          final_target.update({
              "mean_overall_score": 0.80,
              "mean_process_recall": 0.90,
              "mean_process_precision": 0.90,
              "mean_flow_recall": 0.80,
              "mean_flow_precision": 0.80,
          })
          assert mod._all_absolute_pass({"mycelium_2024": final_target})
          print("Incremental gate tests passed; reader is GPT-5.6 with explicit medium reasoning.")
          PY

      - name: Run repository tests after gate configuration
        run: python -m pytest -q

      - name: Run exactly one autonomous repair iteration
        run: python -m ai_lca.autonomous_benchmark_loop --max-iterations 7

      - name: Upload loop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-benchmark-loop-${{ github.run_id }}
          path: artifacts/autonomous_benchmark_loop
          if-no-files-found: warn
          retention-days: 30
