name: Gerloff locked-flow attachment patch

on:
  push:
    branches:
      - feat/gerloff-fast-visual-regression

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gerloff-fast-visual-regression
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest
      - name: Apply bounded locked-flow attachment enforcement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/ai_lca/resilient.py')
          text = path.read_text()
          marker = 'def _canonical_locked_process_id(process_id: str, structure: ForegroundStructure) -> str | None:'
          if marker not in text:
              helper = '''\n\ndef _canonical_locked_process_id(process_id: str, structure: ForegroundStructure) -> str | None:\n    """Resolve a flow attachment to the locked graph without creating subprocesses.\n\n    Structured-output models can occasionally return an internal candidate ID even though\n    the prompt supplies only locked process IDs. Internal stages are bookkeeping children of\n    a retained process, so their flows belong on the nearest locked ancestor. Candidates with\n    no locked ancestry are not valid flow attachments and are rejected.\n    """\n    locked_ids = {process.process_id for process in structure.processes}\n    if process_id in locked_ids:\n        return process_id\n\n    candidates = {candidate.candidate_id: candidate for candidate in structure.candidate_activities}\n    current = candidates.get(process_id)\n    seen: set[str] = set()\n    while current is not None and current.candidate_id not in seen:\n        seen.add(current.candidate_id)\n        parent_id = current.parent_candidate_id\n        if parent_id in locked_ids:\n            return parent_id\n        current = candidates.get(parent_id) if parent_id else None\n    return None\n\n\ndef _enforce_locked_flow_attachments(\n    flows: Iterable[InventoryFlow], structure: ForegroundStructure\n) -> list[InventoryFlow]:\n    """Keep flows on the locked foreground graph and collapse internal-stage attachments upward."""\n    enforced: list[InventoryFlow] = []\n    for flow in flows:\n        process_id = _canonical_locked_process_id(flow.process_id, structure)\n        if process_id is None:\n            continue\n        if process_id != flow.process_id:\n            flow = flow.model_copy(update={"process_id": process_id})\n        enforced.append(flow)\n    return enforced\n'''
              anchor = '\n\ndef _recover_chunk_flows(\n'
              if anchor not in text:
                  raise SystemExit('recovery helper insertion anchor not found')
              text = text.replace(anchor, helper + anchor, 1)

              old = '    merged = merge_supported_flows(base.flows, recovered)\n'
              new = ('    base_flows = _enforce_locked_flow_attachments(base.flows, structure)\n'
                     '    recovered_flows = _enforce_locked_flow_attachments(recovered, structure)\n'
                     '    merged = merge_supported_flows(base_flows, recovered_flows)\n')
              if old not in text:
                  raise SystemExit('merge attachment anchor not found')
              text = text.replace(old, new, 1)
              path.write_text(text)

          test_path = Path('tests/test_resilient.py')
          tests = test_path.read_text()
          if '_canonical_locked_process_id' not in tests.split('\n', 1)[0]:
              tests = tests.replace(
                  'from ai_lca.resilient import _bounded_chunks, _looks_inventory_dense, merge_supported_flows\n',
                  'from ai_lca.resilient import (\n'
                  '    _bounded_chunks,\n'
                  '    _canonical_locked_process_id,\n'
                  '    _enforce_locked_flow_attachments,\n'
                  '    _looks_inventory_dense,\n'
                  '    merge_supported_flows,\n'
                  ')\n'
                  'from types import SimpleNamespace\n',
                  1,
              )
          test_marker = 'def test_internal_stage_flow_attachment_resolves_to_locked_parent():'
          if test_marker not in tests:
              tests += '''\n\ndef _structure_for_attachment_tests():\n    return SimpleNamespace(\n        processes=[SimpleNamespace(process_id="P1"), SimpleNamespace(process_id="P2")],\n        candidate_activities=[\n            SimpleNamespace(candidate_id="P1", parent_candidate_id=None),\n            SimpleNamespace(candidate_id="P1_bop", parent_candidate_id="P1"),\n            SimpleNamespace(candidate_id="P1_stack", parent_candidate_id="P1"),\n            SimpleNamespace(candidate_id="shared_transport", parent_candidate_id=None),\n        ],\n    )\n\n\ndef test_internal_stage_flow_attachment_resolves_to_locked_parent():\n    structure = _structure_for_attachment_tests()\n    assert _canonical_locked_process_id("P1_bop", structure) == "P1"\n    fixed = _enforce_locked_flow_attachments(\n        [flow("pump").model_copy(update={"process_id": "P1_bop"})], structure\n    )\n    assert len(fixed) == 1\n    assert fixed[0].process_id == "P1"\n\n\ndef test_non_locked_candidate_without_locked_ancestry_is_rejected():\n    structure = _structure_for_attachment_tests()\n    fixed = _enforce_locked_flow_attachments(\n        [flow("transport").model_copy(update={"process_id": "shared_transport"})], structure\n    )\n    assert fixed == []\n\n\ndef test_locked_flow_attachment_is_unchanged():\n    structure = _structure_for_attachment_tests()\n    fixed = _enforce_locked_flow_attachments([flow("electricity")], structure)\n    assert len(fixed) == 1\n    assert fixed[0].process_id == "P1"\n'''
              test_path.write_text(tests)
          PY
          python -m pytest -q tests/test_resilient.py
      - name: Commit bounded patch
        shell: bash
        run: |
          if git diff --quiet -- src/ai_lca/resilient.py tests/test_resilient.py; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_lca/resilient.py tests/test_resilient.py
          git commit -m "Enforce locked process attachments for recovered flows"
          git push origin HEAD:feat/gerloff-fast-visual-regression
