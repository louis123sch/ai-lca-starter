name: Terlouw post-holdout development repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/terlouw-post-holdout-development-repair.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ai-lca-terlouw-post-holdout-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20

      - name: Confirm original frozen holdout is preserved
        id: holdout
        env:
          GH_TOKEN: ${{ github.token }}
          HOLDOUT_RUN: "31359955786"
          HOLDOUT_SHA: "7e0dec1c712e3115aa520ec1b2ea4890973708aa"
        shell: bash
        run: |
          set -euo pipefail
          RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HOLDOUT_RUN")"
          test "$(jq -r .head_sha <<<"$RUN")" = "$HOLDOUT_SHA"
          test "$(jq -r .status <<<"$RUN")" = "completed"
          echo "Original Terlouw holdout remains preserved at run $HOLDOUT_RUN on frozen SHA $HOLDOUT_SHA."
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Download preserved Terlouw holdout artifact
        if: steps.holdout.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p repair_input
          gh run download 31359955786 --repo "$GITHUB_REPOSITORY" \
            --name "benchmark-006-final-holdout-7e0dec1c712e3115aa520ec1b2ea4890973708aa-31359955786" \
            --dir repair_input

      - name: Set up Python
        if: steps.holdout.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        if: steps.holdout.outputs.run == 'true'
        run: python -m pip install -e ".[test]"

      - name: Ask repair agent for one conservative general change
        if: steps.holdout.outputs.run == 'true'
        id: repair
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REPAIR_MODEL: gpt-5-mini
        shell: bash
        run: |
          python -m ai_lca.repair_agent \
            --benchmark-root repair_input \
            --source benchmarks/terlouw_2021/source_excerpt.txt \
            --result repair_result.json
          CHANGED="$(python -c 'import json; print(str(json.load(open("repair_result.json"))["changed"]).lower())')"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Run deterministic tests without secrets
        if: steps.repair.outputs.changed == 'true'
        env:
          OPENAI_API_KEY: ""
          GH_TOKEN: ""
        run: python -m pytest -q

      - name: Commit validated general repair
        if: steps.repair.outputs.changed == 'true'
        id: commit
        shell: bash
        run: |
          git config user.name "ai-lca-benchmark-bot"
          git config user.email "ai-lca-benchmark-bot@users.noreply.github.com"
          git add src/ai_lca/llm.py
          git commit -m "general repair: distinguish shared support activities from foreground alternatives"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Wait for main and trigger development regressions
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          for _ in $(seq 1 40); do
            REMOTE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
            [ "$REMOTE_SHA" = "$HEAD_SHA" ] && break
            sleep 3
          done
          gh workflow run gerloff-benchmark.yml --repo "$GITHUB_REPOSITORY" --ref main -f runs=3
          gh workflow run hermesmann-benchmark.yml --repo "$GITHUB_REPOSITORY" --ref main -f runs=3
          gh workflow run benchmark-003.yml --repo "$GITHUB_REPOSITORY" --ref main -f runs=3
          gh workflow run benchmark-004.yml --repo "$GITHUB_REPOSITORY" --ref main -f runs=3

      - name: Record no-change diagnosis
        if: steps.holdout.outputs.run == 'true' && steps.repair.outputs.changed != 'true'
        run: cat repair_result.json
