name: Phase 1 autonomous literature runner

on:
  push:
    branches: [phase1-literature-scale]
    paths:
      - "src/ai_lca/jats.py"
      - "src/ai_lca/autonomous_literature.py"
      - "tests/test_jats.py"
      - "tests/test_autonomous_literature.py"
      - ".github/workflows/literature-autonomous.yml"
  workflow_dispatch:

concurrency:
  group: phase1-autonomous-literature
  cancel-in-progress: false

jobs:
  one-paper-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      SPRINGER_API_KEY: ${{ secrets.SPRINGER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5-mini
      OPENAI_SCREEN_MODEL: gpt-5-nano
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore persistent Phase 1 state
        uses: actions/cache@v4
        with:
          path: literature_state
          key: phase1-literature-state-${{ github.run_id }}
          restore-keys: |
            phase1-literature-state-
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: Run deterministic tests
        run: |
          python -m pytest -q tests/test_literature.py tests/test_jats.py tests/test_autonomous_literature.py
      - name: Verify API secrets
        shell: bash
        run: |
          test -n "$SPRINGER_API_KEY" || { echo "::error::SPRINGER_API_KEY missing"; exit 2; }
          test -n "$OPENAI_API_KEY" || { echo "::error::OPENAI_API_KEY missing"; exit 2; }
      - name: Run one-paper autonomous validation
        run: |
          python -m ai_lca.autonomous_literature \
            --mode one \
            --doi 10.1007/s11367-025-02453-8 \
            --state-dir literature_state \
            --max-papers 1 \
            --max-concurrent-requests 3 \
            --max-process-workers 3 \
            --max-paper-workers 1 \
            --max-total-calls 35 \
            --max-calls-per-paper 35 \
            --max-total-tokens 2000000 \
            --max-estimated-cost-usd 0.75 \
            --max-repair-calls-per-process 1
      - name: Show latest report
        if: always()
        run: |
          if [ -f literature_state/reports/latest.json ]; then
            cat literature_state/reports/latest.json
          fi
      - name: Upload autonomous state and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-autonomous-${{ github.run_id }}
          path: literature_state
          retention-days: 30
