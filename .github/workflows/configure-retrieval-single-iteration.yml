name: Configure retrieval single iteration

on:
  push:
    branches: [agent/retrieval-before-reasoning-clean]
    paths:
      - ".github/workflows/configure-retrieval-single-iteration.yml"

permissions:
  contents: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/retrieval-before-reasoning-clean
          fetch-depth: 0

      - name: Convert retrieval experiment to bounded single iteration
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/retrieval-before-reasoning-experiment.yml')
          text = workflow.read_text(encoding='utf-8')
          text = text.replace(
              'name: Retrieval-before-reasoning autonomous improvement',
              'name: Retrieval-before-reasoning single iteration',
              1,
          )

          start = text.index('on:\n')
          end = text.index('\npermissions:', start)
          text = text[:start] + 'on:\n  workflow_dispatch:\n' + text[end:]

          text = text.replace('--max-total-calls 100 \\\n', '--max-total-calls 60 \\\n')
          text = text.replace('--max-total-tokens 1500000 \\\n', '--max-total-tokens 400000 \\\n')
          text = text.replace('--max-estimated-cost-usd 1.00 \\\n', '--max-estimated-cost-usd 0.25 \\\n')
          text = text.replace('--max-proposal-attempts 3 \\\n', '--max-proposal-attempts 1 \\\n')

          text = text.replace(
              '          cp -a frozen_corpus patched_control_canary_state\n'
              '          cp -a frozen_corpus patched_routed_canary_state\n',
              '          cp -a frozen_corpus patched_routed_canary_state\n',
              1,
          )
          text = text.replace(
              '--control artifacts/patched_control_canary.json \\\n',
              '--control artifacts/current_control_canary.json \\\n',
              1,
          )
          text = text.replace(
              '--control-state patched_control_canary_state \\\n',
              '--control-state current_control_canary_state \\\n',
              1,
          )

          disable = {
              'Prepare current-head full states',
              'Run current frozen control on all 44',
              'Run current frozen retrieval on all 44',
              'Gate current retrieval against full control',
              'Run patched frozen control canary',
              'Prepare patched full states',
              'Run patched frozen control on all 44',
              'Run patched frozen retrieval on all 44',
              'Gate patched retrieval against full control',
              'Commit accepted retrieval repair',
              'Record rejected retrieval experiment',
              'Explicitly dispatch next retrieval iteration',
          }
          lines = text.splitlines()
          out = []
          i = 0
          while i < len(lines):
              line = lines[i]
              out.append(line)
              if line.startswith('      - name: '):
                  name = line[len('      - name: '):]
                  if name in disable:
                      if i + 1 < len(lines) and lines[i + 1].lstrip().startswith('if:'):
                          i += 1
                          out.append('        if: ${{ false }}')
                      else:
                          out.append('        if: ${{ false }}')
              i += 1
          text = '\n'.join(out) + '\n'

          marker = '      - name: Upload iteration evidence\n'
          if marker not in text:
              raise SystemExit('upload marker not found')
          summary_step = r'''      - name: Summarize single-iteration progress
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              p = Path(path)
              if not p.exists():
                  return {}
              try:
                  return json.loads(p.read_text(encoding='utf-8'))
              except json.JSONDecodeError:
                  return {}

          before = load('artifacts/current_canary_comparison.json')
          after = load('artifacts/patched_canary_comparison.json')
          iteration = load('artifacts/retrieval_autonomous_iteration/iteration.json')
          current_routed = load('artifacts/current_routed_canary.json')
          patched_routed = load('artifacts/patched_routed_canary.json')

          def regression_stats(report):
              regressions = report.get('regressions') or []
              lost = sum(len(r.get('lost_unprotected_flow_candidate_ids') or []) for r in regressions)
              reasons = sum(len(r.get('reasons') or []) for r in regressions)
              return {
                  'regression_papers': len(regressions),
                  'lost_unprotected_flows': lost,
                  'regression_reasons': reasons,
              }

          before_stats = regression_stats(before)
          after_stats = regression_stats(after)
          before_dois = {r.get('doi') for r in before.get('regressions') or [] if r.get('doi')}
          after_dois = {r.get('doi') for r in after.get('regressions') or [] if r.get('doi')}
          router_safe = bool(after.get('router_safety_pass'))
          accepted = bool(after.get('pass_gate'))
          strict_progress = accepted or (
              router_safe
              and after_stats['regression_papers'] <= before_stats['regression_papers']
              and after_stats['lost_unprotected_flows'] < before_stats['lost_unprotected_flows']
              and not (after_dois - before_dois)
          )

          current_usage = current_routed.get('usage') or {}
          patched_usage = patched_routed.get('usage') or {}
          result = {
              'accepted_by_canary_gate': accepted,
              'scientific_progress': strict_progress,
              'before': before_stats,
              'after': after_stats,
              'new_regression_dois': sorted(after_dois - before_dois),
              'resolved_regression_dois': sorted(before_dois - after_dois),
              'router_safety_pass': router_safe,
              'proposal_summary': iteration.get('summary'),
              'proposal_changed_paths': iteration.get('changed_paths') or [],
              'deterministic_tests_passed': iteration.get('deterministic_tests_passed'),
              'current_routed_usage': current_usage,
              'patched_routed_usage': patched_usage,
          }
          Path('artifacts/single_iteration_progress.json').write_text(
              json.dumps(result, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(result, indent=2))
          PY

'''
          text = text.replace(marker, summary_step + marker, 1)
          workflow.write_text(text, encoding='utf-8')

          repair = Path('src/ai_lca/retrieval_autonomous_iteration.py')
          rtext = repair.read_text(encoding='utf-8')
          old = '''ALLOWED_FILES = [
    "src/ai_lca/evidence_router.py",
    "src/ai_lca/retrieval_processor.py",
    "src/ai_lca/retrieval_replay.py",
    "src/ai_lca/retrieval_compare.py",
    "src/ai_lca/frozen_replay.py",
    "tests/test_evidence_router.py",
    "tests/test_retrieval_compare.py",
    "tests/test_frozen_replay.py",
]'''
          new = '''ALLOWED_FILES = [
    "src/ai_lca/evidence_router.py",
    "src/ai_lca/retrieval_processor.py",
    "src/ai_lca/retrieval_replay.py",
    "tests/test_evidence_router.py",
    "tests/test_retrieval_compare.py",
    "tests/test_frozen_replay.py",
]'''
          if old not in rtext:
              raise SystemExit('ALLOWED_FILES block not found')
          repair.write_text(rtext.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate workflow and tests
        run: |
          python -m pip install -e ".[test]"
          python -m py_compile src/ai_lca/retrieval_autonomous_iteration.py
          python -m pytest -q tests/test_autonomous_code_iteration.py tests/test_evidence_router.py tests/test_retrieval_compare.py tests/test_frozen_replay.py

      - name: Commit bounded single-iteration mode
        run: |
          git config user.name "ai-lca-single-iteration-setup"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/retrieval-before-reasoning-experiment.yml src/ai_lca/retrieval_autonomous_iteration.py
          git diff --cached --quiet && exit 0
          git commit -m "Make retrieval iteration bounded and single-shot"
          git push origin HEAD:agent/retrieval-before-reasoning-clean
