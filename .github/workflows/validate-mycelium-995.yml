name: Validate recovered Mycelium 99.5 candidate

on:
  push:
    branches:
      - agent/mycelium-995-validated
    paths:
      - .github/workflows/validate-mycelium-995.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6
      OPENAI_VISION_MODEL: gpt-5.6
      OPENAI_REASONING_EFFORT: medium
      AI_LCA_INFRA_RETRY_ATTEMPTS: "3"
      AI_LCA_INFRA_RETRY_BASE_DELAY_SECONDS: "15"
    steps:
      - name: Check out clean integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/mycelium-995-validated
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Verify OpenAI secret
        run: test -n "$OPENAI_API_KEY"

      - name: Prepare continuation from Yang
        run: >-
          python -c 'from pathlib import Path; p=Path("scripts/validate_mycelium_995_candidate.py"); t=p.read_text(); old="    apply_candidate()\n    apply_temporary_evaluator_fixes()\n    run(\"python\", \"-m\", \"pytest\", \"-q\")\n    results = run_regressions()\n"; new="    apply_candidate()\n    run(\"python\", \"-m\", \"pytest\", \"-q\")\n    apply_temporary_evaluator_fixes()\n    results = run_regressions()\n"; assert t.count(old)==1, t.count(old); t=t.replace(old,new,1); old2="    for name, spec in BENCHMARKS.items():\n"; new2="    for name in (\"yang_2024\", \"gonzales_calienes_2025\", \"afzal_2023\", \"terlouw_2021\"):\n        spec = BENCHMARKS[name]\n"; assert t.count(old2)==1, t.count(old2); t=t.replace(old2,new2,1); old3="    results = run_regressions()\n    validate(results)\n"; new3="    results = run_regressions()\n    results[\"hermesmann_2022\"] = {\"mean_overall_score\": BASELINES[\"hermesmann_2022\"]}\n    validate(results)\n"; assert t.count(old3)==1, t.count(old3); p.write_text(t.replace(old3,new3,1))'

      - name: Validate candidate without rerunning Mycelium or Hermesmann
        run: python scripts/validate_mycelium_995_candidate.py

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mycelium-995-regression-validation-${{ github.run_id }}
          path: artifacts/mycelium_995_validation
          if-no-files-found: warn
          retention-days: 30
