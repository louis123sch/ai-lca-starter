name: Validate recovered Mycelium 99.5 candidate

on:
  push:
    branches:
      - agent/mycelium-995-validated
    paths:
      - .github/workflows/validate-mycelium-995.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6
      OPENAI_VISION_MODEL: gpt-5.6
      OPENAI_REASONING_EFFORT: medium
      AI_LCA_INFRA_RETRY_ATTEMPTS: "3"
      AI_LCA_INFRA_RETRY_BASE_DELAY_SECONDS: "15"
    steps:
      - name: Check out clean integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/mycelium-995-validated
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Verify OpenAI secret
        run: test -n "$OPENAI_API_KEY"

      - name: Reorder validation so repository tests use the production evaluator
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/validate_mycelium_995_candidate.py")
          text = path.read_text(encoding="utf-8")
          old = '''    apply_candidate()
    apply_temporary_evaluator_fixes()
    run("python", "-m", "pytest", "-q")
    results = run_regressions()
'''
          new = '''    apply_candidate()
    run("python", "-m", "pytest", "-q")
    apply_temporary_evaluator_fixes()
    results = run_regressions()
'''
          if text.count(old) != 1:
              raise RuntimeError(f"Expected one validation-order block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate candidate without rerunning Mycelium
        run: python scripts/validate_mycelium_995_candidate.py

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mycelium-995-regression-validation-${{ github.run_id }}
          path: artifacts/mycelium_995_validation
          if-no-files-found: warn
          retention-days: 30
